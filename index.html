<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CreatorPilot AI — AI YouTube Studio</title>
<style>
:root{--bg:#0a0a0d;--bg2:#101016;--card:#14141b;--card2:#1a1a22;--line:#26262f;--gold:#d4af37;--gold2:#f5d76e;--gold-dim:#8a7326;--txt:#f5f3ea;--mut:#a7a7b3;--dim:#6d6d78;--ok:#3ecf6e;--bad:#ff5d5d;--warn:#ffb020;--info:#5db4ff;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
a{color:var(--gold2);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 90px}
/* header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(10,10,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:.3px}
.logo .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,#9c7a1e);display:flex;align-items:center;justify-content:center;color:#141414;font-weight:900;font-size:17px}
.logo b{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:4px;margin-left:8px;flex:1;overflow-x:auto}
.nav a{color:var(--mut);padding:8px 12px;border-radius:9px;font-size:14px;white-space:nowrap}
.nav a.on,.nav a:hover{color:var(--gold2);background:#1c1a12}
.huser{font-size:12.5px;color:var(--dim);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* buttons/inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card2);color:var(--txt);padding:10px 16px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--gold-dim)}
.btn.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));border:none;color:#191904;font-weight:800}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:#ff8f8f;border-color:#4a2424}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:600;letter-spacing:.2px}
.inp,select.inp,textarea.inp{width:100%;background:#0e0e13;border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px 13px;font-size:14.5px;font-family:inherit}
.inp:focus{outline:none;border-color:var(--gold)}
textarea.inp{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--gold-dim);transform:translateY(-1px)}
.card .ic{font-size:24px;margin-bottom:8px}
.card .t{font-weight:700;font-size:14px}
.card .s{font-size:12px;color:var(--dim);margin-top:3px}
.card.gold{background:linear-gradient(135deg,#2a2210,#1a1608);border-color:var(--gold-dim)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:16px 0}
.panel h2{font-size:16px;margin-bottom:4px}
.panel h3{font-size:14.5px;margin:18px 0 10px;color:var(--gold2)}
.ph-sub{font-size:13px;color:var(--dim);margin-bottom:12px}
/* project list */
.proj{display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:11px}
.thumb{width:64px;height:64px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#191904;background:linear-gradient(135deg,var(--gold2),var(--gold) 65%,#8a6d1c)}
.pmain{flex:1;min-width:0}
.ptitle{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:12px;color:var(--dim);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.pbar{height:6px;background:#0c0c10;border-radius:4px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:4px}
.pact{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.3px}
.b-draft{background:#23232c;color:var(--mut)}.b-processing{background:#3a2c10;color:var(--gold2)}.b-completed{background:#12351f;color:var(--ok)}.b-failed{background:#3d1717;color:#ff8f8f}
.b-queued{background:#23232c;color:var(--mut)}.b-retrying{background:#2c2340;color:#c9a7ff}
/* stepper */
.steps{display:flex;flex-direction:column;gap:0;margin:6px 0}
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 4px;border-left:2px solid var(--line);margin-left:9px;padding-left:18px;position:relative}
.step .dot{position:absolute;left:-8px;top:14px;width:14px;height:14px;border-radius:50%;background:#2a2a33;border:2px solid var(--dim)}
.step.s-completed .dot{background:var(--ok);border-color:var(--ok)}
.step.s-failed .dot{background:var(--bad);border-color:var(--bad)}
.step.s-processing .dot{background:var(--gold);border-color:var(--gold)}
.step .sn{font-weight:700;font-size:14px}
.step .sd{font-size:12.5px;color:var(--dim)}
.step .row{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap}
.step .grow{flex:1;min-width:140px}
/* scenes */
.scene{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.scene .sh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.scene .sid{font-weight:800;color:var(--gold2);font-size:13.5px}
.scene .stm{font-size:12px;color:var(--dim)}
.scene .kv{font-size:13px;margin:5px 0}
.scene .kv b{color:var(--gold2);font-weight:600;display:inline-block;min-width:74px;font-size:12px}
.vres{border-radius:11px;padding:12px 14px;margin:10px 0;font-size:13.5px}
.vres.ok{background:#0f2a1a;border:1px solid #1d5c36;color:#bfe9cd}
.vres.no{background:#2e1414;border:1px solid #5c2323;color:#f3c1c1}
.vres.warn{background:#2e2410;border:1px solid #5c4a1d;color:#f0dcae}
.vres ul{margin:6px 0 0 18px}
/* misc */
.note{background:#141310;border:1px dashed var(--gold-dim);border-radius:11px;padding:12px 14px;font-size:13px;color:var(--mut);margin:12px 0}
.note b{color:var(--gold2)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;color:var(--dim);font-weight:600;padding:8px;border-bottom:1px solid var(--line);font-size:12px}
table.tbl td{padding:9px 8px;border-bottom:1px solid #1c1c24;vertical-align:top}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#1e1e26;border:1px solid var(--gold-dim);color:var(--txt);padding:11px 18px;border-radius:12px;font-size:13.5px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:92vw;text-align:center}
.empty{text-align:center;color:var(--dim);padding:34px 16px;font-size:14px}
.hero{background:linear-gradient(135deg,#1d1708,#0e0c05);border:1px solid var(--gold-dim);border-radius:18px;padding:26px 22px;margin:18px 0}
.hero h1{font-size:24px;margin-bottom:8px}
.hero h1 b{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:14px;max-width:640px}
.authbox{max-width:420px;margin:40px auto}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1}
pre.code{background:#0c0c10;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;overflow:auto;white-space:pre-wrap;color:#d8d8e0}
.copyrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.copyrow pre{flex:1}
@media(max-width:720px){.grid2{grid-template-columns:1fr}.nav a{padding:8px 9px;font-size:13px}.huser{display:none}.proj{flex-wrap:wrap}.pact{width:100%;justify-content:flex-start}.hero h1{font-size:20px}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in">
<div class="logo"><span class="mk">C</span><b>CreatorPilot&nbsp;AI</b></div>
<nav class="nav" id="nav"></nav>
<span class="huser" id="huser"></span>
<span id="hact"></span>
</div></header>
<div class="wrap"><div id="app"></div></div>
<div id="modal"></div>
<script>
'use strict';
/* ============ config ============ */
const SB_URL='https://jhpimqhbbbzuglhpnxha.supabase.co';
const SB_KEY='sb_publishable_bw_b2sOM1UUuWCuPb3yyQQ_6BonzaBi';
const STEPS=[['research','Research'],['script','Script'],['scene','Scene Plan'],['visual','Visuals'],['voice','Voice'],['caption','Captions'],['render','Render'],['thumbnail','Thumbnail'],['upload','YouTube Upload']];
const AI_WAIT=new Set(['research','visual','voice','render','thumbnail','upload']); // need Phase-2 AI services
/* ============ tiny supabase client (fetch; no dependency) ============ */
const ses={
 get(){try{return JSON.parse(localStorage.getItem('cp_session')||'null')}catch(e){return null}},
 set(v){v?localStorage.setItem('cp_session',JSON.stringify(v)):localStorage.removeItem('cp_session')}
};
async function authReq(path,opts){
 opts=opts||{};
 const r=await fetch(SB_URL+'/auth/v1'+path,Object.assign({headers:{apikey:SB_KEY,'Content-Type':'application/json'}},opts));
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||('Auth failed ('+r.status+')'));
 return d;
}
async function api(method,path,body,prefer){
 const s=ses.get(),h={apikey:SB_KEY};
 if(s&&s.access_token)h['Authorization']='Bearer '+s.access_token;
 if(body!==undefined)h['Content-Type']='application/json';
 if(prefer)h['Prefer']=prefer;
 const r=await fetch(SB_URL+'/rest/v1/'+path,{method:method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((d&&(d.message||d.hint))||('Request failed ('+r.status+')'));
 return d;
}
const R={
 get:p=>api('GET',p),
 post:(p,b)=>api('POST',p,b,'return=representation'),
 patch:(p,b)=>api('PATCH',p,b,'return=representation'),
 del:p=>api('DELETE',p)
};
const enc=encodeURIComponent;
let _user=null;
async function me(force){
 if(_user&&!force)return _user;
 let s=ses.get();if(!s)return null;
 if(s.expires_at*1000<Date.now()+60000){
  try{const d=await authReq('/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh_token})});ses.set(d);s=d;}
  catch(e){ses.set(null);_user=null;return null;}
 }
 try{_user=await authReq('/user',{headers:{apikey:SB_KEY,Authorization:'Bearer '+s.access_token}});}
 catch(e){_user=null;}
 return _user;
}
async function ensureProfile(u){
 const ex=await R.get('profiles?select=id&id=eq.'+u.id).catch(()=>[]);
 if(!ex||!ex.length){
  const base=((u.email||'user').split('@')[0]||'user').replace(/[^a-z0-9_]/gi,'').slice(0,30)||'user';
  await R.post('profiles',{id:u.id,username:base,display_name:base}).catch(()=>{});
 }
}
/* ============ ui helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2600);}
function fmtDur(s){s=Math.round(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function fmtDate(d){try{return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}
function stBadge(s){return '<span class="badge b-'+s+'">'+s+'</span>'}
function openModal(html){$('#modal').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';}
function closeModal(){$('#modal').innerHTML='';}
window.closeModal=closeModal;
function copyTxt(id){const el=document.getElementById(id);if(!el)return;const t=el.innerText||el.value||'';navigator.clipboard.writeText(t).then(()=>toast('Copied')).catch(()=>toast('Copy failed'));}
window.copyTxt=copyTxt;
function dl(name,text){const b=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
window.dl=dl;
/* ============ router ============ */
const app=()=>document.getElementById('app');
function setNav(route){
 const u=_user;
 const links=[['dashboard','Dashboard'],['create','＋ Create'],['channel','Channel'],['analytics','Analytics'],['settings','⚙️ Settings']];
 $('#nav').innerHTML=u?links.map(l=>'<a href="#/'+l[0]+'" class="'+(route===l[0]?'on':'')+'">'+l[1]+'</a>').join(''):'';
 $('#huser').textContent=u?(u.email||''):'';
 $('#hact').innerHTML=u?'<button class="btn sm" onclick="doLogout()">Logout</button>':'';
}
window.doLogout=async()=>{const s=ses.get();if(s)await authReq('/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+s.access_token}}).catch(()=>{});ses.set(null);_user=null;location.hash='#/login';};
function parseHash(){const h=(location.hash||'#/dashboard').replace(/^#\/?/,'');const qi=h.indexOf('?');return{path:qi<0?h:h.slice(0,qi),q:qi<0?{}:Object.fromEntries(new URLSearchParams(h.slice(qi+1)))};}
async function nav(){
 const{path,q}=parseHash();const seg=path.split('/');const page=seg[0]||'dashboard';
 if(page!=='login'){const u=await me();if(!u){location.hash='#/login';return;}await ensureProfile(u);}
 setNav(page);
 try{
  if(page==='login')pgAuth();
  else if(page==='dashboard')await pgDash(q);
  else if(page==='create')pgCreate();
  else if(page==='project')await pgProject(seg[1]);
  else if(page==='channel')await pgChannel();
  else if(page==='analytics')await pgAnalytics();
  else if(page==='settings')pgSettings();
  else app().innerHTML='<div class="empty">Page not found.</div>';
 }catch(e){app().innerHTML='<div class="vres no"><b>Error:</b> '+esc(e.message)+'</div>';}
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',nav);
/* ============ auth ============ */
function pgAuth(){
 setNav('login');
 app().innerHTML=`<div class="authbox"><div class="hero" style="text-align:center"><h1>Creator<b>Pilot</b> AI</h1><p>Topic se YouTube video tak — deterministic AI pipeline studio.</p></div>
 <div class="panel"><div class="tabs"><button class="btn sm primary" id="tL">Login</button><button class="btn sm" id="tS">Sign up</button></div>
 <div class="field"><label>Email</label><input class="inp" id="aEmail" type="email" placeholder="you@example.com"></div>
 <div class="field"><label>Password</label><input class="inp" id="aPass" type="password" placeholder="••••••••"></div>
 <button class="btn primary" id="aGo" style="width:100%">Login</button>
 <div id="aErr" style="color:#ff8f8f;font-size:13px;margin-top:10px"></div></div></div>`;
 let mode='login';
 const setM=m=>{mode=m;$('#tL').className='btn sm'+(m==='login'?' primary':'');$('#tS').className='btn sm'+(m==='signup'?' primary':'');$('#aGo').textContent=m==='login'?'Login':'Create account';};
 $('#tL').onclick=()=>setM('login');$('#tS').onclick=()=>setM('signup');
 $('#aGo').onclick=async()=>{
  const em=$('#aEmail').value.trim(),pw=$('#aPass').value;$('#aErr').textContent='';
  if(!em||!pw){$('#aErr').textContent='Email and password required.';return;}
  $('#aGo').disabled=true;
  try{
   const d=mode==='login'
    ?await authReq('/token?grant_type=password',{method:'POST',body:JSON.stringify({email:em,password:pw})})
    :await authReq('/signup',{method:'POST',body:JSON.stringify({email:em,password:pw})});
   if(!d.access_token)throw new Error('No session returned — check Supabase Auth settings.');
   ses.set(d);_user=null;await me(true);await ensureProfile(_user);
   toast(mode==='login'?'Welcome back!':'Account created!');location.hash='#/dashboard';
  }catch(e){$('#aErr').textContent=e.message;}
  $('#aGo').disabled=false;
 };
}
/* ============ dashboard ============ */
const FILTERS={all:'My Projects',processing:'Processing',completed:'Completed',failed:'Failed',draft:'Drafts'};
async function pgDash(q){
 const f=q.f||'all';
 let sel='select=*,generation_jobs(step,status)&order=created_at.desc';
 if(f!=='all')sel+='&status=eq.'+f;
 const rows=await R.get('projects?'+sel).catch(e=>{throw e});
 const counts={};
 for(const r of await R.get('projects?select=status').catch(()=>[]))counts[r.status]=(counts[r.status]||0)+1;
 const cards=[
  ['＋','Create New Video','Start a new AI video project','gold',"location.hash='#/create'"],
  ['🎬','My Projects',(counts.draft||0)+(counts.processing||0)+(counts.completed||0)+(counts.failed||0)+' total','',"location.hash='#/dashboard?f=all'"],
  ['⚙️','Processing',(counts.processing||0)+' active','',"location.hash='#/dashboard?f=processing'"],
  ['✅','Completed',(counts.completed||0)+' done','',"location.hash='#/dashboard?f=completed'"],
  ['⚠️','Failed',(counts.failed||0)+' need retry','',"location.hash='#/dashboard?f=failed'"],
  ['📺','YouTube Channel','Manage channel',"location.hash='#/channel'"],
  ['📊','Analytics','Views & growth',"location.hash='#/analytics'"]
 ];
 let h=`<div class="hero"><h1>AI YouTube <b>Studio</b></h1><p>Topic do — research, script, scenes, voice, visuals, captions, thumbnail, SEO aur upload tak ka deterministic pipeline yahin manage hota hai.</p></div>
 <div class="cards">`+cards.map(c=>`<div class="card ${c[3]}" onclick="${c[4]}"><div class="ic">${c[0]}</div><div class="t">${c[1]}</div><div class="s">${c[2]}</div></div>`).join('')+`</div>
 <div class="panel"><h2>${FILTERS[f]||'My Projects'}</h2><div class="ph-sub">${rows.length} project(s)</div><div id="plist">`;
 if(!rows.length)h+='<div class="empty">No projects yet. Hit <b>＋ Create New Video</b> to start.</div>';
 h+='</div></div>';
 app().innerHTML=h;
 const pl=$('#plist');
 for(const p of rows){
  const done=(p.generation_jobs||[]).filter(j=>j.status==='completed').length;
  const pct=Math.round(done/9*100);
  const el=document.createElement('div');el.className='proj';
  el.innerHTML=`<div class="thumb">${esc((p.topic||'?').trim()[0].toUpperCase())}</div>
  <div class="pmain"><div class="ptitle">${esc(p.topic)}</div>
  <div class="pmeta">${stBadge(p.status)}<span>${p.video_type==='short'?'Short':'Long'} · ${fmtDur(p.duration_secs)}</span><span>${fmtDate(p.created_at)}</span><span>${pct}%</span></div>
  <div class="pbar"><i style="width:${pct}%"></i></div></div>
  <div class="pact">
   <button class="btn sm" data-a="edit">Edit</button>
   <button class="btn sm" data-a="prev">Preview</button>
   ${p.status==='failed'?'<button class="btn sm" data-a="retry">Retry</button>':''}
   <button class="btn sm danger" data-a="del">Delete</button>
  </div>`;
  el.querySelector('[data-a=edit]').onclick=()=>location.hash='#/project/'+p.id;
  el.querySelector('[data-a=prev]').onclick=()=>previewProject(p.id);
  const rt=el.querySelector('[data-a=retry]');if(rt)rt.onclick=()=>retryProject(p.id);
  el.querySelector('[data-a=del]').onclick=async()=>{if(confirm('Delete "'+p.topic+'"? All scenes, jobs and drafts go too.')){await R.del('projects?id=eq.'+p.id);toast('Deleted');nav();}};
  pl.appendChild(el);
 }
}
async function jobMap(pid){
 const jobs=await R.get('generation_jobs?select=step,status,detail,error,attempts&project_id=eq.'+pid);
 const m={};jobs.forEach(j=>m[j.step]=j);return m;
}
async function refreshProgress(pid){
 const m=await jobMap(pid);
 const done=STEPS.filter(s=>m[s[0]]&&m[s[0]].status==='completed').length;
 const pct=Math.round(done/STEPS.length*100);
 const anyFail=STEPS.some(s=>m[s[0]]&&m[s[0]].status==='failed');
 const anyProc=STEPS.some(s=>m[s[0]]&&['processing','retrying'].includes(m[s[0]].status));
 await R.patch('projects?id=eq.'+pid,{progress:pct,status:anyFail?'failed':(done===STEPS.length?'completed':(anyProc||done>0?'processing':'draft')),updated_at:new Date().toISOString()});
 return pct;
}
async function retryProject(pid){

/* ============ scenes: timeline + REAL validation ============ */
function validateScenes(scenes,project){
 const errs=[],warns=[];
 if(!scenes.length)errs.push('No scenes yet — add scenes first.');
 const ids=scenes.map(s=>s.scene_id).slice().sort((a,b)=>a-b);
 const dup=ids.filter((v,i)=>ids.indexOf(v)!==i);
 if(dup.length)errs.push('Duplicate scene_id(s): '+[...new Set(dup)].join(', '));
 ids.forEach((id,i)=>{if(id!==i+1)errs.push('Scene IDs must run 1,2,3… in order (position '+(i+1)+' has ID '+id+').');});
 const sorted=scenes.slice().sort((a,b)=>a.scene_id-b.scene_id);
 sorted.forEach((s,i)=>{
  const n='Scene '+s.scene_id+': ';
  if(!(s.end_secs>s.start_secs))errs.push(n+'end must be after start.');
  if(s.start_secs<0)errs.push(n+'start cannot be negative.');
  if(!String(s.narration||'').trim())errs.push(n+'missing narration (voice). [scene-lock]');
  if(!String(s.visual||'').trim())errs.push(n+'missing visual. [scene-lock]');
  if(!String(s.caption||'').trim())errs.push(n+'missing caption. [scene-lock]');
  if(i===0&&Math.abs(s.start_secs)>0.01)errs.push('Timeline must start at 0s (scene 1 starts at '+s.start_secs+'s).');
  if(i>0){const pv=sorted[i-1],gap=s.start_secs-pv.end_secs;
   if(gap<-0.01)errs.push('Scene '+s.scene_id+' overlaps scene '+pv.scene_id+'.');
   else if(gap>0.01)errs.push('Gap of '+gap.toFixed(2)+'s between scene '+pv.scene_id+' and '+s.scene_id+'.');}
 });
 const total=sorted.length?Number(sorted[sorted.length-1].end_secs):0;
 if(sorted.length&&project&&Math.abs(total-project.duration_secs)/project.duration_secs>0.05)
  warns.push('Timeline total '+total.toFixed(1)+'s differs from target '+project.duration_secs+'s by >5%.');
 return{ok:!errs.length,errs:errs,warns:warns,total:total};
}

/* ============ SEO generator (real template logic) ============ */
function genSEO(topic,lang,scenes){
 const t=topic.trim();
 const words=t.split(/\s+/).filter(w=>w.length>1);
 const kwCap=words.map(w=>w[0].toUpperCase()+w.slice(1)).join('');
 const titles=[
  t+' 😱 | Hindi Kahani',
  t+' — 5 Surprising Facts 🤯',
  'Kya Aap Jante Hain? '+t+' 🤔',
  t+' | Best Hindi Cartoon Story',
  '😲 '+t+' Ne Sabko Hairan Kar Diya!'
 ];
 const chaps=(scenes||[]).slice(0,8).map(s=>'• '+fmtDur(s.start_secs)+' — '+String(s.caption||('Scene '+s.scene_id))).join('\n');
 const desc=t+' — ek majedar aur seekh bhari Hindi cartoon kahani.\n\nIs video me aap dekhenge:\n'+(chaps||'• '+t)+'\n\nAisi aur kahaniyon ke liye subscribe karein! 🔔\n\n#HindiKahani #Cartoon';
 const baseTags=words.map(w=>w.toLowerCase()).concat(['hindi kahani','cartoon video','moral story','kids video','3d cartoon','hindi story','cartoon kahani']);
 const tags=[...new Set(baseTags)].filter(Boolean).slice(0,12);
 const clean=words.filter(w=>w.length>2).slice(0,4).map(w=>w.replace(/[^a-zA-Z0-9\u0900-\u097F]/g,'')).filter(Boolean);
 const hashtags=['#HindiKahani','#Cartoon','#MoralStory','#KidsVideo'].concat(clean.map(w=>'#'+w)).filter((v,i,a)=>a.indexOf(v)===i).slice(0,8);
 return{titles:titles,description:desc,tags:tags,hashtags:hashtags};
}

/* ============ captions helper (real timing logic) ============ */
function splitLen(text,max){
 const words=String(text||'').split(/\s+/).filter(Boolean),out=[];let cur='';
 for(const w of words){if((cur+' '+w).trim().length>max){if(cur)out.push(cur.trim());cur=w;}else cur+=' '+w;}
 if(cur.trim())out.push(cur.trim());return out.length?out:[text||'…'];
}
function cuesFromScenes(scenes){
 const cues=[];
 for(const s of scenes){
  const chunks=splitLen(s.narration,42);
  const dur=(Number(s.end_secs)-Number(s.start_secs))/chunks.length;
  chunks.forEach((c,i)=>cues.push({start:Number(s.start_secs)+i*dur,end:Number(s.start_secs)+(i+1)*dur,text:c}));
 }
 return cues;
}
function toSRT(cues){
 const f=s=>{const ms=Math.round(s*1000);const p=n=>String(n).padStart(2,'0');return p(Math.floor(ms/3600000))+':'+p(Math.floor(ms/60000)%60)+':'+p(Math.floor(ms/1000)%60)+','+String(ms%1000).padStart(3,'0');};
 return cues.map((c,i)=>(i+1)+'\n'+f(c.start)+' --> '+f(c.end)+'\n'+c.text+'\n').join('\n');
}

/* ================================================================
   PHASE 2 — real AI pipeline (2026-10-06). No mocks, no fake output.
   - Gemini key: localStorage only ('cp_gemini_key'), calls go DIRECTLY
     from this browser to generativelanguage.googleapis.com. Nothing is
     proxied or stored on any server.
   - YouTube OAuth token: sessionStorage only (tab close = logout).
   - Rendered video / generated images / voice clips live in this browser
     session (blob URLs). Small clips are ALSO saved as data URLs in the
     DB text columns; big ones stay session-only (said honestly in UI).
   ================================================================ */
const LS={gk:'cp_gemini_key',gm:'cp_gemini_model',gi:'cp_gemini_img_model',gt:'cp_gemini_tts_model',oc:'cp_oauth_client'};
const gkey=()=> (localStorage.getItem(LS.gk)||'').trim();
const gmodel=()=> (localStorage.getItem(LS.gm)||'').trim()||'gemini-3-flash-preview';
const gimgmodel=()=> (localStorage.getItem(LS.gi)||'').trim()||'gemini-3.1-flash-image';
const gttsmodel=()=> (localStorage.getItem(LS.gt)||'').trim()||'gemini-3.1-flash-tts-preview';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* per-step run hints for the stepper (accurate per step) */
const NEEDS_RUN=new Set(['research','visual','voice','render','thumbnail','upload']);
const RUN_HINT={research:'Needs Gemini key — <a href="#/settings">Settings</a>',visual:'Needs Gemini key — <a href="#/settings">Settings</a>',voice:'Needs Gemini key — <a href="#/settings">Settings</a>',render:'Browser me render hoga (koi key nahi chahiye)',thumbnail:'3 concepts banenge (headline ke liye key)',upload:'Rendered video + YouTube OAuth chahiye'};
function gMsg(st,d,what){
 const m=(d&&(d.error&&d.error.message))||'';
 if(st===400)return 'API key galat hai ya model available nahi. Settings me key/model check karo.'+(m?' ('+m.slice(0,120)+')':'');
 if(st===401||st===403)return 'Key reject hui (401/403) — ya to key galat hai, ya us par restriction hai, ya Gemini API enable nahi hai.'+(m?' ('+m.slice(0,120)+')':'');
 if(st===404)return 'Model nahi mila (404) — Settings me model ka naam check karo.';
 if(st===429)return 'Gemini free-tier quota / rate-limit khatam (429). Ye normal hai — kuch der baad Retry dabao, paise nahi lagenge.';
 if(st>=500)return 'Google server error ('+st+') — thodi der baad retry karo.';
 return (what||'Gemini')+' request fail ('+st+').'+(m?' '+m.slice(0,140):'');
}
async function gCall(model,body,what){
 const k=gkey();
 if(!k){const e=new Error('NO_KEY');e.noKey=true;throw e;}
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(gMsg(r.status,d,what));
 return d;
}
function gParts(d){try{return (((d.candidates||[])[0]||{}).content||{}).parts||[];}catch(e){return[];}}
async function gText(prompt,json){
 const body={contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.7}};
 if(json)body.generationConfig.responseMimeType='application/json';
 const d=await gCall(gmodel(),body,'Text');
 let t=gParts(d).map(p=>p.text||'').join('');
 if(!t.trim())throw new Error('Gemini se khaali jawab aaya — dobara try karo.');
 if(json){t=t.replace(/```json|```/gi,'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)t=t.slice(a,b+1);
  try{return JSON.parse(t);}catch(e){throw new Error('Gemini ne sahi JSON nahi diya — Retry dabao.');}}
 return t;
}
async function gImage(prompt){
 const d=await gCall(gimgmodel(),{contents:[{parts:[{text:prompt}]}],generationConfig:{responseModalities:['TEXT','IMAGE']}},'Image');
 const p=gParts(d).find(p=>p.inlineData&&/^image\//.test(p.inlineData.mimeType||''));
 if(!p)throw new Error('Gemini ne image nahi di (safety filter ya quota ho sakta hai) — Retry dabao.');
 return{mime:p.inlineData.mimeType,data:p.inlineData.data};
}
async function gTTS(text,voice){
 const d=await gCall(gttsmodel(),{contents:[{parts:[{text:text}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}},'Voice');
 const p=gParts(d).find(p=>p.inlineData&&/^audio\//.test(p.inlineData.mimeType||''));
 if(!p)throw new Error('Gemini ne audio nahi diya — Retry dabao.');
 return{mime:p.inlineData.mimeType,data:p.inlineData.data};
}
/* ---------- session asset stores ---------- */
const _IMG={},_VO={};            // assetId -> blobURL, voiceoverId -> blobURL
let _renderBlob=null,_renderUrl=null;
function b64ToBlob(b64,mime){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime});}
function dataUrl(mime,b64){return 'data:'+mime+';base64,'+b64;}
function imgFor(a){if(_IMG[a.id])return _IMG[a.id];return a.storage_path||null;}
function audFor(v){if(_VO[v.id])return _VO[v.id];return v.audio_path||null;}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Image load fail'));i.src=src;});}
async function audioBuf(url){
 const AC=audioBuf._c||(audioBuf._c=new (window.AudioContext||window.webkitAudioContext)());
 if(AC.state==='suspended'){try{await AC.resume();}catch(e){}}
 const ab=await (await fetch(url)).arrayBuffer();
 return{ac:AC,buf:await AC.decodeAudioData(ab)};
}
function drawCoverCtx(x,img,W,H,zoom,panX,alpha){
 if(alpha!=null)x.globalAlpha=alpha;
 const ir=img.width/img.height,cr=W/H;let bw,bh;
 if(ir>cr){bh=H*(zoom||1);bw=bh*ir;}else{bw=W*(zoom||1);bh=bw/ir;}
 x.drawImage(img,(W-bw)/2+(panX||0)*W,(H-bh)/2,bw,bh);
 if(alpha!=null)x.globalAlpha=1;
}

async function doAIScript(p){
 const rs=await R.get('research_sources?select=claim,source&project_id=eq.'+p.id+'&verified=eq.true').catch(()=>[]);
 const factBlock=rs.length?('Use ONLY these verified facts (each at most once):\n'+rs.map((r,i)=>(i+1)+'. '+r.claim+' ('+r.source+')').join('\n')+'\n'):'No verified facts available — use only facts you are highly confident about; avoid specific statistics.\n';
 const pr=await gText('You are a YouTube scriptwriter.\nWrite a scene-wise script in '+p.language+' for a '+(p.video_type==='short'?'vertical YouTube Short':'long YouTube video')+' titled "'+p.topic+'".\nTotal duration: '+p.duration_secs+' seconds. Visual style: '+p.visual_style+'. Audience: '+p.target_audience+'.\n'+factBlock+'Rules:\n- Strong hook in the first 3 seconds.\n- One idea per scene; dialogue lines may start with SPEAKER: (e.g. ALOO: ...).\n- Captions short and punchy (under 40 characters).\n- Visual: detailed description with character, action, environment, lighting.\nReply ONLY as JSON: {"scenes":[{"narration":"...","visual":"...","caption":"...","camera":"...","sfx":"...","transition":"...","duration_secs":5}]}\nScene durations should add up to about '+p.duration_secs+' seconds. No markdown.',true);
 const list=(pr.scenes||[]);
 if(!list.length)throw new Error('Gemini ne scenes nahi diye.');
 let sum=list.reduce((a,s)=>a+(+s.duration_secs||5),0)||1;
 let t=0;const rows=[];
 list.forEach((s,i)=>{
  const d=Math.max(2,Math.round((+s.duration_secs||5)/sum*p.duration_secs));
  rows.push({scene_id:i+1,start_secs:+t.toFixed(2),end_secs:+(t+d).toFixed(2),narration:String(s.narration||''),visual:String(s.visual||''),caption:String(s.caption||''),camera:String(s.camera||''),sfx:String(s.sfx||''),transition:String(s.transition||'')});
  t+=d;
 });
 rows[rows.length-1].end_secs=+t.toFixed(2);
 await R.del('scenes?project_id=eq.'+p.id);
 for(const r of rows){await R.post('scenes',Object.assign({project_id:p.id},r));await sleep(120);}
 const full=rows.map(r=>'SCENE '+r.scene_id+'\nVOICE: '+r.narration+'\nVISUAL: '+r.visual).join('\n\n');
 const ex=await R.get('scripts?select=id&project_id=eq.'+p.id+'&order=created_at.desc&limit=1');
 if(ex[0])await R.patch('scripts?id=eq.'+ex[0].id,{content:full,word_count:full.split(/\s+/).filter(Boolean).length});
 else await R.post('scripts',{project_id:p.id,content:full,word_count:full.split(/\s+/).filter(Boolean).length});
 await setJob(p.id,'script','completed','AI script: '+rows.length+' scenes, ~'+t.toFixed(0)+'s');
 const v=validateScenes(rows,p);
 await setJob(p.id,'scene',v.ok?'completed':'failed',v.ok?('Validated: '+rows.length+' scenes locked, '+v.total.toFixed(1)+'s timeline'):('Validation failed: '+v.errs[0]));
 if(!v.ok)throw new Error('Scene validation fail: '+v.errs[0]);
}
/* ---------- STEP: visuals ---------- */
async function doVisuals(p){
 const scenes=await R.get('scenes?select=*&project_id=eq.'+p.id+'&order=scene_id');
 if(!scenes.length)throw new Error('Pehle script/scenes banao.');
 const ar=p.video_type==='short'?'vertical 9:16 portrait composition':'16:9 widescreen composition';
 const charNote='CHARACTER CONSISTENCY: keep the exact same character design (face, clothes, colors) across all scenes of this video about "'+p.topic+'".';
 await R.del('assets?project_id=eq.'+p.id);
 let n=0;
 for(const s of scenes){
  const prompt=s.visual+'. Art style: '+p.visual_style+'. '+ar+'. '+charNote+' No text, no words, no letters, no watermark anywhere in the image.';
  const im=await gImage(prompt);
  const blob=b64ToBlob(im.data,im.mime);
  const row=(await R.post('assets',{project_id:p.id,scene_id:s.scene_id,kind:'image',prompt:prompt.slice(0,1000),storage_path:null,status:'completed'}))[0];
  _IMG[row.id]=URL.createObjectURL(blob);
  const approxKB=Math.round(im.data.length*0.75/1024);
  if(approxKB<900)await R.patch('assets?id=eq.'+row.id,{storage_path:dataUrl(im.mime,im.data)});
  n++;await setJobRun(p.id,'visual','Scene '+s.scene_id+'/'+scenes.length+' image done');
  await sleep(1200);
 }
 await setJob(p.id,'visual','completed',n+' scene images generated (Gemini)');
}
/* ---------- STEP: voice ---------- */
function ttsText(nar){
 return String(nar||'').split('\n').map(l=>l.replace(/^[A-Z\u0900-\u0975][A-Z\u0900-\u0975\s.'’-]{1,24}:\s*/,'').trim()).filter(Boolean).join(' ');
}
async function doVoice(p){
 const scenes=await R.get('scenes?select=*&project_id=eq.'+p.id+'&order=scene_id');
 if(!scenes.length)throw new Error('Pehle scenes banao.');
 const voice=p.voice_gender==='male'?'Charon':'Aoede';
 await R.del('voiceovers?project_id=eq.'+p.id);
 let shift=0;
 for(const s of scenes){
  const txt=ttsText(s.narration);
  if(!txt)throw new Error('Scene '+s.scene_id+' me narration khaali hai.');
  const au=await gTTS(txt,voice);
  const blob=b64ToBlob(au.data,au.mime);
  const tmpUrl=URL.createObjectURL(blob);
  let dur;
  try{dur=+((await audioBuf(tmpUrl)).buf.duration).toFixed(2);}catch(e){throw new Error('Scene '+s.scene_id+' audio decode fail — Retry dabao.');}
  const row=(await R.post('voiceovers',{project_id:p.id,scene_id:s.scene_id,text:txt,voice:voice,audio_path:null,duration_secs:dur,status:'completed'}))[0];
  _VO[row.id]=URL.createObjectURL(blob);
  const approxKB=Math.round(au.data.length*0.75/1024);
  if(approxKB<1500)await R.patch('voiceovers?id=eq.'+row.id,{audio_path:dataUrl(au.mime,au.data)});
  const start=+(+s.start_secs+shift).toFixed(2);
  let end=+(+s.end_secs+shift).toFixed(2);
  if(dur>(end-start)+0.3){
   const delta=dur-(end-start)+0.5;end=+(end+delta).toFixed(2);shift+=delta;
   await R.patch('scenes?id=eq.'+s.id,{end_secs:end});
   const later=await R.get('scenes?select=id,start_secs,end_secs&project_id=eq.'+p.id+'&scene_id=gt.'+s.scene_id);
   for(const l of later)await R.patch('scenes?id=eq.'+l.id,{start_secs:+(+l.start_secs+delta).toFixed(2),end_secs:+(+l.end_secs+delta).toFixed(2)});
  }
  await setJobRun(p.id,'voice','Scene '+s.scene_id+'/'+scenes.length+' voice done');
  await sleep(1200);
 }
 await setJob(p.id,'voice','completed',scenes.length+' scene voiceovers — scene durations voice se auto-synced');
}

/* ---------- STEP: render (canvas + Web Audio + MediaRecorder) ---------- */
async function doRender(p,onProg){
 const scenes=await R.get('scenes?select=*&project_id=eq.'+p.id+'&order=scene_id');
 if(!scenes.length)throw new Error('Scenes missing hain.');
 const v=validateScenes(scenes,p);
 if(!v.ok)throw new Error('Validation: '+v.errs[0]);
 const assets=await R.get('assets?select=*&project_id=eq.'+p.id);
 const am={};assets.forEach(a=>{if(a.scene_id&&!am[a.scene_id])am[a.scene_id]=a;});
 const voices=await R.get('voiceovers?select=*&project_id=eq.'+p.id);
 const vm={};voices.forEach(x=>{if(x.scene_id)vm[x.scene_id]=x;});
 for(const s of scenes){
  const a=am[s.scene_id];
  if(!a||!imgFor(a))throw new Error('Scene '+s.scene_id+' ki image missing — Visuals step chalao.');
  const vv=vm[s.scene_id];
  if(!vv||!audFor(vv))throw new Error('Scene '+s.scene_id+' ka voiceover missing — Voice step chalao.');
 }
 const imgs=[];
 for(const s of scenes)imgs.push(await loadImg(imgFor(am[s.scene_id])));
 const bufs=[];
 for(const s of scenes){const r=await audioBuf(audFor(vm[s.scene_id]));bufs.push(r.buf);}
 const AC=audioBuf._c;
 const caps=await R.get('captions?select=text,start_secs,end_secs&project_id=eq.'+p.id+'&order=start_secs').catch(()=>[]);
 const W=p.video_type==='short'?1080:1920,H=p.video_type==='short'?1920:1080;
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;
 const cx=cv.getContext('2d');
 const dest=AC.createMediaStreamDestination();
 const t0=AC.currentTime+0.4;
 scenes.forEach((s,i)=>{
  const src=AC.createBufferSource();src.buffer=bufs[i];
  src.connect(dest);try{src.connect(AC.destination);}catch(e){}
  src.start(Math.max(t0,t0+s.start_secs));
 });
 const stream=cv.captureStream(30);
 const tracks=stream.getVideoTracks().concat(dest.stream.getAudioTracks());
 if(!tracks.length)throw new Error('Canvas capture fail — browser support check karo.');
 const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
 if(!mime)throw new Error('Is browser me MediaRecorder/webm support nahi hai.');
 const rec=new MediaRecorder(new MediaStream(tracks),{mimeType:mime,videoBitsPerSecond:p.video_type==='short'?6000000:8000000});
 const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
 const doneP=new Promise(res=>{rec.onstop=res;});
 rec.start(500);
 const total=+scenes[scenes.length-1].end_secs;
 await setJobRun(p.id,'render','Rendering… 0%');
 let lastPct=-1;
 const fs=Math.round(W/16);
 await new Promise(resolve=>{
  function frame(){
   const t=AC.currentTime-t0;   // audio clock = perfect A/V sync
   if(t>=total){resolve();return;}
   let idx=scenes.findIndex(s=>t>=+s.start_secs&&t<+s.end_secs);
   if(idx<0)idx=t<+scenes[0].start_secs?0:scenes.length-1;
   const s=scenes[idx];
   const k=Math.min(1,Math.max(0,(t-s.start_secs)/Math.max(0.01,(s.end_secs-s.start_secs))));
   cx.fillStyle='#000';cx.fillRect(0,0,W,H);
   drawCoverCtx(cx,imgs[idx],W,H,1+0.12*k,(k-0.5)*0.08);
   const XF=0.6;
   if(idx<scenes.length-1&&t>s.end_secs-XF)drawCoverCtx(cx,imgs[idx+1],W,H,1,0,(t-(s.end_secs-XF))/XF);
   const cue=caps.find(c=>t>=+c.start_secs&&t<+c.end_secs);
   const capText=cue?cue.text:(s.caption||'');
   if(capText){
    const lines=splitLen(capText,34).slice(-2);
    cx.font='800 '+fs+'px system-ui,-apple-system,sans-serif';cx.textAlign='center';cx.textBaseline='bottom';
    const lh=fs*1.28,y0=H*0.90;
    lines.forEach((ln,i)=>{
     const y=y0-(lines.length-1-i)*lh;
     cx.lineWidth=Math.max(4,Math.round(fs/7));cx.strokeStyle='rgba(0,0,0,0.88)';cx.lineJoin='round';
     cx.strokeText(ln,W/2,y);cx.fillStyle='#fff';cx.fillText(ln,W/2,y);
    });
   }
   const pct=Math.max(0,Math.min(99,Math.round(t/total*100)));
   if(pct!==lastPct){lastPct=pct;if(onProg)onProg(pct);}
   requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
 });
 rec.stop();await doneP;
 _renderBlob=new Blob(chunks,{type:'video/webm'});
 if(_renderUrl)URL.revokeObjectURL(_renderUrl);
 _renderUrl=URL.createObjectURL(_renderBlob);
 const rj=(await R.get('render_jobs?select=id&project_id=eq.'+p.id+'&order=created_at.desc&limit=1'))[0];
 if(rj)await R.patch('render_jobs?id=eq.'+rj.id,{status:'completed',progress:100,output_path:null,error:null,updated_at:new Date().toISOString()});
 await setJob(p.id,'render','completed','Rendered '+total.toFixed(0)+'s webm ('+(_renderBlob.size/1048576).toFixed(1)+' MB) — isi session me download karo');
 return{url:_renderUrl,blob:_renderBlob,total:total};
}

async function doThumbnails(p){
 const assets=await R.get('assets?select=*&project_id=eq.'+p.id+'&order=created_at');
 if(!assets.length||!imgFor(assets[0]))throw new Error('Pehle Visuals generate karo.');
 const img=await loadImg(imgFor(assets[0]));
 let heads=[];
 try{
  const r=await gText('Video topic: "'+p.topic+'". Give 3 YouTube thumbnail headlines in '+p.language+', each 3 to 6 words, punchy and clickable (emoji allowed). Reply ONLY as JSON: {"headlines":["...","...","..."]}. No markdown.',true);
  heads=(r.headlines||[]).slice(0,3).map(h=>String(h).slice(0,42));
 }catch(e){heads=[];}
 while(heads.length<3)heads.push(p.topic.slice(0,42));
 const urls=[];
 for(let i=0;i<3;i++){
  const c=document.createElement('canvas');c.width=1280;c.height=720;
  const x=c.getContext('2d');
  drawCoverCtx(x,img,1280,720,1.08,(i-1)*0.04);
  const g=x.createLinearGradient(0,280,0,720);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.78)');
  x.fillStyle=g;x.fillRect(0,0,1280,720);
  if(i===0){x.fillStyle='#d4af37';x.fillRect(90,86,200,22);}
  if(i===2){x.fillStyle='rgba(212,175,55,0.9)';x.beginPath();x.arc(1150,120,64,0,7);x.fill();x.fillStyle='#141414';x.font='900 64px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('!',1150,124);}
  const hl=heads[i]||p.topic;
  const fs=i===0?96:88;
  const lines=splitLen(hl,18).slice(-2);
  x.font='900 '+fs+'px system-ui,-apple-system,sans-serif';x.textAlign='center';x.textBaseline='bottom';
  const col=i===1?'#ffffff':'#f5d76e';
  lines.forEach((ln,j)=>{
   const y=684-(lines.length-1-j)*(fs*1.18);
   x.lineWidth=10;x.strokeStyle='rgba(0,0,0,0.92)';x.lineJoin='round';
   x.strokeText(ln,640,y);x.fillStyle=col;x.fillText(ln,640,y);
  });
  urls.push({url:c.toDataURL('image/jpeg',0.85),headline:hl});
 }
 await R.del('thumbnails?project_id=eq.'+p.id);
 const ids=[];
 for(let i=0;i<3;i++){
  const r=(await R.post('thumbnails',{project_id:p.id,concept:i+1,image_path:urls[i].url,headline:urls[i].headline,status:'completed',selected:false}))[0];
  ids.push(r.id);
 }
 await setJob(p.id,'thumbnail','completed','3 concepts ready — neeche se pick karo');
 openModal('<h2 style="margin-bottom:4px">Thumbnail pick karo</h2><div class="ph-sub">3 concepts — pasand aaye to "Use this" dabao.</div>'+
  urls.map((u,i)=>'<div style="margin-bottom:14px"><img src="'+u.url+'" style="width:100%;border-radius:10px;border:1px solid var(--line)" alt="thumbnail concept '+(i+1)+'"><div style="display:flex;gap:8px;margin-top:6px;align-items:center"><span style="font-size:13px;color:var(--mut)">"'+esc(u.headline)+'"</span><span style="flex:1"></span><button class="btn sm primary" onclick="pickThumb(\''+p.id+'\',\''+ids[i]+'\')">Use this</button></div></div>').join('')+
  '<div style="display:flex;gap:8px"><button class="btn sm" onclick="closeModal()">Close</button><button class="btn sm" id="thRe">↻ Regenerate</button></div>');
 $('#thRe').onclick=async()=>{closeModal();try{await doThumbnails(p);}catch(e){toast('❌ '+e.message);}};
}

/* ---------- YouTube OAuth + upload ---------- */
function ytToken(){
 const t=sessionStorage.getItem('cp_yt_token'),exp=+sessionStorage.getItem('cp_yt_exp')||0;
 return (t&&Date.now()<exp-60000)?t:null;
}
function ytOAuth(returnHash){
 const cid=(localStorage.getItem(LS.oc)||'').trim();
 if(!cid||!/\.apps\.googleusercontent\.com$/.test(cid)){toast('Settings me Google OAuth Client ID add karo');location.hash='#/settings';return false;}
 sessionStorage.setItem('cp_oauth_return',returnHash||location.hash||'#/dashboard');
 const ru=location.origin+location.pathname;
 location.href='https://accounts.google.com/o/oauth2/v2/auth?client_id='+encodeURIComponent(cid)+'&redirect_uri='+encodeURIComponent(ru)+'&response_type=token&scope='+encodeURIComponent('https://www.googleapis.com/auth/youtube.upload')+'&state=cp';
 return true;
}
window.ytOAuth=ytOAuth;
async function doUpload(p){
 const d=(await R.get('youtube_uploads?select=*&project_id=eq.'+p.id+'&order=created_at.desc&limit=1'))[0];
 if(!d)throw new Error('SEO draft missing — pehle SEO section se "Save as upload draft" karo.');
 if(!d.title)throw new Error('Draft me title missing hai.');
 if(!_renderBlob)throw new Error('Rendered video is session me nahi hai — pehle Render step chalao.');
 const tok=ytToken();
 if(!tok){ytOAuth('#/project/'+p.id);const e=new Error('OAUTH_REDIRECT');throw e;}
 await setJobRun(p.id,'upload','Uploading… 0%');
 await R.patch('youtube_uploads?id=eq.'+d.id,{status:'uploading',error:null});
 try{
  const desc=(d.description||'')+'\n\n🤖 AI disclosure: Is video ki script, voiceover aur visuals AI tools (Google Gemini) se generate kiye gaye hain.';
  const meta={snippet:{title:d.title,description:desc,tags:(d.tags||[]).slice(0,30),categoryId:'1'},status:{privacyStatus:['public','unlisted','private'].includes(d.visibility)?d.visibility:'private',selfDeclaredMadeForKids:false}};
  const init=await fetch('https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Length':String(_renderBlob.size),'X-Upload-Content-Type':'video/webm'},body:JSON.stringify(meta)});
  if(!init.ok){const t=await init.text().catch(()=> '');throw new Error('YouTube init fail ('+init.status+'): '+t.slice(0,160));}
  const upUrl=init.headers.get('location');
  if(!upUrl)throw new Error('YouTube ne upload URL nahi diya.');
  const CH=8*1048576;let off=0,vid=null;
  while(off<_renderBlob.size){
   const end=Math.min(off+CH,_renderBlob.size);
   const rr=await fetch(upUrl,{method:'PUT',headers:{'Authorization':'Bearer '+tok,'Content-Length':String(end-off),'Content-Range':'bytes '+off+'-'+(end-1)+'/'+_renderBlob.size},body:_renderBlob.slice(off,end)});
   if(rr.status===308){const rg=rr.headers.get('range');off=rg?parseInt(rg.split('-')[1],10)+1:end;}
   else if(rr.ok){vid=(await rr.json()).id;off=end;}
   else{const t=await rr.text().catch(()=> '');throw new Error('Upload fail ('+rr.status+'): '+t.slice(0,160));}
   await setJobRun(p.id,'upload','Uploading… '+Math.round(off/_renderBlob.size*90)+'%');
  }
  if(!vid)throw new Error('YouTube ne video ID nahi diya.');
  try{
   const th=(await R.get('thumbnails?select=image_path&project_id=eq.'+p.id+'&selected=eq.true&order=created_at.desc&limit=1'))[0]
    ||(await R.get('thumbnails?select=image_path&project_id=eq.'+p.id+'&order=created_at.desc&limit=1'))[0];
   if(th&&th.image_path){
    const bl=await (await fetch(th.image_path)).blob();
    await fetch('https://www.googleapis.com/upload/youtube/v3/thumbnails/set?videoId='+encodeURIComponent(vid),{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':bl.type||'image/jpeg'},body:bl});
   }
  }catch(e){/* thumbnail optional — video upload hi asli kaam hai */}
  await R.patch('youtube_uploads?id=eq.'+d.id,{status:'completed',yt_video_id:vid,error:null});
  await setJob(p.id,'upload','completed','Uploaded: https://youtu.be/'+vid+' — Studio me "altered content" disclosure tick karna na bhoolo');
 }catch(e){
  if(e&&e.message==='OAUTH_REDIRECT')throw e;
  await R.patch('youtube_uploads?id=eq.'+d.id,{status:'failed',error:String(e.message).slice(0,500)});
  throw e;
 }
}
/* ---------- job runner (deterministic order, per-step retry) ---------- */
async function runStep(pid,step){
 const p=(await R.get('projects?select=*&id=eq.'+pid))[0];
 if(!p)throw new Error('Project not found');
 await setJobRun(pid,step,'Running…');
 try{
  if(step==='research')await doResearch(p);
  else if(step==='script')await doAIScript(p);
  else if(step==='scene'){
   const ss=await R.get('scenes?select=*&project_id=eq.'+pid+'&order=scene_id');
   const vv=validateScenes(ss,p);
   if(!vv.ok)throw new Error(vv.errs[0]);
   await setJob(pid,step,'completed','Validated: '+ss.length+' scenes locked, '+vv.total.toFixed(1)+'s timeline');
  }
  else if(step==='visual')await doVisuals(p);
  else if(step==='voice')await doVoice(p);
  else if(step==='caption')await doCaptions(p);
  else if(step==='render')await doRender(p,function(pct){
   const b=document.getElementById('renProg');if(b)b.style.width=pct+'%';
   const t=document.getElementById('renPct');if(t)t.textContent=pct+'%';
  });
  else if(step==='thumbnail')await doThumbnails(p);
  else if(step==='upload')await doUpload(p);
 }catch(e){
  if(e&&e.message==='OAUTH_REDIRECT'){await setJobRun(pid,step,'Google sign-in ke liye redirect ho raha hai…');return 'oauth';}
  await setJobErr(pid,step,e.noKey?'Gemini API key missing — Settings me apni free key add karo.':e.message);
  throw e;
 }
}
async function runAll(pid){
 for(const s of STEPS){
  const m=await jobMap(pid);
  if(m[s[0]]&&m[s[0]].status==='completed')continue;
  toast('▶ '+s[1]+'…');
  try{const r=await runStep(pid,s[0]);if(r==='oauth')return;}
  catch(e){toast('❌ '+s[1]+' fail: '+(e.noKey?'API key missing — Settings me add karo':String(e.message).slice(0,140)));return;}
 }
 toast('✅ Pipeline complete!');
 await refreshProgress(pid);
}
window.runStep=runStep;window.runAll=runAll;
window.runOne=async function(pid,step){

/* ---------- settings page ---------- */
function pgSettings(){
 const k=gkey(),mc=gmodel(),ic=gimgmodel(),tc=gttsmodel(),oc=(localStorage.getItem(LS.oc)||'').trim();
 const yt=!!ytToken();
 app().innerHTML=`<div class="panel" style="max-width:720px"><h2>⚙️ Settings — API Keys</h2><div class="ph-sub">Keys sirf <b>is browser ke localStorage</b> me rehti hain — kahin upload nahi hoti. AI calls seedha Google ke API ko jaati hain.</div>
 <h3>Gemini API key (free)</h3>
 <div class="field"><label>API key</label><input class="inp" id="sKey" type="password" autocomplete="off" placeholder="AIza..." value="${esc(k)}"></div>
 <div class="grid2">
  <div class="field"><label>Text model</label><input class="inp" id="sM" value="${esc(mc)}"></div>
  <div class="field"><label>Image model</label><input class="inp" id="sI" value="${esc(ic)}"></div>
 </div>
 <div class="field"><label>TTS model</label><input class="inp" id="sT" value="${esc(tc)}"></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px"><button class="btn primary sm" id="sSave">💾 Save</button><button class="btn sm" id="sTest">🧪 Test key</button><button class="btn sm danger" id="sDel">Remove key</button></div>
 <div class="note"><b>Free key kaise lein (3 steps):</b><br>1. <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> kholo → "Create API key" dabao.<br>2. Key copy karke upar paste karo → Save.<br>3. <b>Important:</b> Google Cloud Console → APIs & Services → Credentials → apni key → "HTTP referrers" me <code>${esc(location.origin)}/*</code> add karo, taaki key sirf is site par chale.<br><span style="color:var(--dim)">Free-tier limits: text quota generous hai; image/TTS par roz ki limit hoti hai — 429 aaye to thodi der baad Retry dabao.</span></div>
 <h3>YouTube upload (OAuth)</h3>
 <div class="field"><label>Google OAuth Client ID (apna)</label><input class="inp" id="sOc" autocomplete="off" placeholder="xxxx.apps.googleusercontent.com" value="${esc(oc)}"></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px"><button class="btn primary sm" id="sOcSave">💾 Save Client ID</button>${yt?'<button class="btn sm" id="sYtOut">Disconnect YouTube</button>':'<button class="btn sm" id="sYtIn">🔗 Connect YouTube</button>'}</div>
 <div style="font-size:12.5px;color:var(--dim);margin-bottom:6px">Status: ${yt?'<span style="color:#3ecf6e">connected (session only)</span>':'<span style="color:#ffb020">not connected</span>'}</div>
 <div class="note"><b>Client ID kaise banayein:</b><br>1. <a href="https://console.cloud.google.com/" target="_blank" rel="noopener">console.cloud.google.com</a> → naya project → <b>YouTube Data API v3</b> enable karo.<br>2. OAuth consent screen → External → app name bharo → test user me apna Gmail add karo.<br>3. Credentials → Create Credentials → <b>OAuth client ID</b> → type <b>Web application</b> → Authorized redirect URI me ye exact add karo:<br><code>${esc(location.origin+location.pathname)}</code><br>4. Client ID copy karke upar paste karo → Save → Connect YouTube.<br><span style="color:var(--dim)">Note: Google "unverified app" warning dikhayega — personal use ke liye normal hai (Advanced → continue). Token sirf session me rehta hai — tab band = logout.</span></div>
 </div>`;
 $('#sSave').onclick=()=>{
  localStorage.setItem(LS.gk,$('#sKey').value.trim());
  localStorage.setItem(LS.gm,$('#sM').value.trim()||'gemini-3-flash-preview');
  localStorage.setItem(LS.gi,$('#sI').value.trim()||'gemini-3.1-flash-image');
  localStorage.setItem(LS.gt,$('#sT').value.trim()||'gemini-3.1-flash-tts-preview');
  toast('Saved — key sirf is browser me hai');
 };
 $('#sTest').onclick=async()=>{
  const b=$('#sTest');b.disabled=true;
  try{const t=await gText('Reply with exactly: OK');toast(/^\s*OK/.test(t)?'✅ Key kaam kar rahi hai!':'⚠️ Jawab aaya lekin ajeeb: '+t.slice(0,60));}
  catch(e){toast('❌ '+(e.noKey?'Pehle key save karo':e.message));}
  b.disabled=false;
 };
 $('#sDel').onclick=()=>{localStorage.removeItem(LS.gk);$('#sKey').value='';toast('Key removed');};
 $('#sOcSave').onclick=()=>{
  const v=$('#sOc').value.trim();
  if(v&&!/\.apps\.googleusercontent\.com$/.test(v)){toast('Client ID ".apps.googleusercontent.com" par khatam hona chahiye');return;}
  localStorage.setItem(LS.oc,v);toast('Client ID saved');nav();
 };
 const yi=$('#sYtIn');if(yi)yi.onclick=()=>ytOAuth('#/settings');
 const yo=$('#sYtOut');if(yo)yo.onclick=()=>{sessionStorage.removeItem('cp_yt_token');sessionStorage.removeItem('cp_yt_exp');toast('YouTube disconnected');nav();};
}
/* ---------- OAuth redirect return (before router) ---------- */
function oauthReturn(){
 try{
  const h=location.hash||'';
  if(h.indexOf('access_token=')>=0){
   const ps=Object.fromEntries(new URLSearchParams(h.charAt(0)==='#'?h.slice(1):h));
   if(ps.access_token){
    sessionStorage.setItem('cp_yt_token',ps.access_token);
    sessionStorage.setItem('cp_yt_exp',String(Date.now()+(parseInt(ps.expires_in||'3599',10)*1000)));
   }
   const ret=sessionStorage.getItem('cp_oauth_return')||'#/dashboard';
   history.replaceState(null,'',location.pathname+location.search);
   location.hash=ret;
   setTimeout(()=>toast('YouTube connected ✓'),400);
  }
 }catch(e){}
}
/* ============ init ============ */
oauthReturn();
nav();

</script>
</body>
</html>
