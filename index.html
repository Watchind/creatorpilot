<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CreatorPilot AI — Prompt se Video</title>
<style>
:root{--bg:#0a0a0d;--bg2:#101016;--card:#14141b;--card2:#1a1a22;--line:#26262f;--gold:#d4af37;--gold2:#f5d76e;--gold-dim:#8a7326;--txt:#f5f3ea;--mut:#a7a7b3;--dim:#6d6d78;--ok:#3ecf6e;--bad:#ff5d5d;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;min-height:100vh;background-image:radial-gradient(900px 480px at 50% -120px,rgba(212,175,55,.10),transparent 70%)}
a{color:var(--gold2);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.hdr{position:sticky;top:0;z-index:50;background:rgba(10,10,13,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px}
.logo .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,#9c7a1e);display:flex;align-items:center;justify-content:center;color:#141414;font-weight:900;font-size:17px;flex:none}
.logo b{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;margin-left:6px}
.nav a{color:var(--mut);padding:9px 13px;border-radius:10px;font-size:14px;white-space:nowrap;font-weight:600}
.nav a.on,.nav a:hover{color:var(--gold2);background:#1c1a12}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card2);color:var(--txt);padding:10px 16px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;min-height:44px}
.btn:hover{border-color:var(--gold-dim)}
.btn.sm{padding:7px 12px;font-size:13px;min-height:40px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hero-big{text-align:center;padding:54px 20px 26px;animation:fadeUp .5s ease}
.hero-big h1{font-size:clamp(36px,9vw,66px);font-weight:900;letter-spacing:-1px;line-height:1.12}
.hero-big h1 .g{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-big p{color:var(--mut);font-size:16px;max-width:540px;margin:14px auto 0}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.feats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:24px 0 30px}
.feat{background:rgba(20,20,27,.72);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13.5px;color:var(--mut);width:210px;backdrop-filter:blur(6px);animation:fadeUp .5s ease}
.feat b{color:var(--txt);display:block;margin-bottom:3px;font-size:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:380px;margin:6px auto;padding:15px;border-radius:14px;border:1px solid #d8d8d8;background:#fff;color:#1a1a1a;font-size:16px;font-weight:700;cursor:pointer;min-height:56px;transition:.15s}
.gbtn:hover{box-shadow:0 6px 24px rgba(255,255,255,.18)}
.gbtn:disabled{opacity:.6;cursor:not-allowed}
.g-ic{width:22px;height:22px;flex:none}
.errline{color:#ff8f8f;font-size:13.5px;margin:12px auto 0;max-width:380px;text-align:center;min-height:20px}
.studio{max-width:720px;margin:0 auto;animation:fadeUp .4s ease}
.panel{background:rgba(20,20,27,.78);border:1px solid var(--line);border-radius:20px;padding:22px;margin:16px 0;backdrop-filter:blur(8px)}
.panel h2{font-size:19px;margin-bottom:2px}
.ph-sub{font-size:13px;color:var(--dim);margin-bottom:6px}
textarea.prompt{width:100%;min-height:124px;background:#0e0e13;border:1px solid var(--line);border-radius:14px;color:var(--txt);padding:14px;font-size:15.5px;font-family:inherit;resize:vertical;margin-top:10px}
textarea.prompt:focus{outline:none;border-color:var(--gold)}
.opt-label{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.5px;margin:18px 0 8px;text-transform:uppercase}
.seg{display:flex;background:#0e0e13;border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;color:var(--mut);padding:11px 6px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;min-height:48px}
.seg button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#191904;box-shadow:0 4px 14px rgba(212,175,55,.3)}
.up-prevs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.up-prevs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--gold-dim)}
.filebtn{display:inline-flex;align-items:center;gap:8px;margin-top:10px}
.btn-go{width:100%;padding:16px;border:none;border-radius:15px;font-size:17px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#191904;box-shadow:0 8px 28px rgba(212,175,55,.25);transition:.15s;min-height:58px;margin-top:22px}
.btn-go:active{transform:scale(.98)}
.btn-go:disabled{opacity:.65;cursor:wait}
.generating{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 28px rgba(212,175,55,.25)}50%{box-shadow:0 8px 44px rgba(212,175,55,.55)}}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 6px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;color:var(--dim);font-weight:700;transition:.2s}
.st .ic{font-size:21px;display:block;margin-bottom:4px}
.st.on{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 1px var(--gold-dim)}
.st.done{border-color:#1d5c36;color:var(--ok)}
.st.fail{border-color:#5c2323;color:#ff8f8f}
.pbar{height:10px;background:#0c0c10;border:1px solid var(--line);border-radius:6px;margin:12px 0 6px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:6px;transition:width .3s}
.pmeta{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.pmsg{font-size:13.5px;color:var(--mut);margin-top:8px;min-height:22px}
.pmsg.err{color:#ff8f8f}
.vres{border-radius:12px;padding:13px 15px;margin:12px 0;font-size:13.5px}
.vres.no{background:#2e1414;border:1px solid #5c2323;color:#f3c1c1}
video.out{width:100%;border-radius:14px;border:1px solid var(--line);background:#000;margin-top:6px;max-height:60vh}
.resbtns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.resbtns .btn,.resbtns a.btn{flex:1;min-width:150px}
.note{background:#141310;border:1px dashed var(--gold-dim);border-radius:11px;padding:12px 14px;font-size:13px;color:var(--mut);margin:12px 0}
.note b{color:var(--gold2)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.3px}
.b-draft{background:#23232c;color:var(--mut)}.b-processing{background:#3a2c10;color:var(--gold2)}.b-completed{background:#12351f;color:var(--ok)}.b-failed{background:#3d1717;color:#ff8f8f}
.proj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:11px}
.proj .t{font-weight:700;font-size:14.5px}
.proj .m{font-size:12.5px;color:var(--dim);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;color:var(--dim);padding:40px 16px;font-size:14px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeUp .2s ease}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:18px;max-width:480px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.modal h2{margin-bottom:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:600}
.inp{width:100%;background:#0e0e13;border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px 13px;font-size:14.5px;font-family:inherit}
.inp:focus{outline:none;border-color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#1e1e26;border:1px solid var(--gold-dim);color:var(--txt);padding:11px 18px;border-radius:12px;font-size:13.5px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:92vw;text-align:center}
.about{margin:46px auto 0;max-width:720px;text-align:center;padding:28px 18px 46px;border-top:1px solid var(--line);color:var(--dim);font-size:13px}
.about h3{color:var(--gold2);font-size:14px;margin-bottom:6px;letter-spacing:.4px}
.about p{margin:9px 0;line-height:1.65}
.about .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
@media(max-width:560px){.panel{padding:18px 15px}.hero-big{padding:40px 14px 20px}.stages{gap:6px}.st{font-size:11px;padding:8px 4px}}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in">
<div class="logo"><span class="mk">C</span><b>CreatorPilot&nbsp;AI</b></div>
<nav class="nav" id="nav"></nav>
<span id="hact" style="display:flex;gap:8px;align-items:center"></span>
</div></header>
<div class="wrap"><div id="app"></div></div>
<div id="modal"></div>
<script>
'use strict';
/* ============ config ============ */
const SB_URL='https://jhpimqhbbbzuglhpnxha.supabase.co';
const SB_KEY='sb_publishable_bw_b2sOM1UUuWCuPb3yyQQ_6BonzaBi';
/* ============ tiny supabase client (fetch; no dependency) ============ */
const ses={
 get(){try{return JSON.parse(localStorage.getItem('cp_session')||'null')}catch(e){return null}},
 set(v){v?localStorage.setItem('cp_session',JSON.stringify(v)):localStorage.removeItem('cp_session')}
};
async function authReq(path,opts){
 opts=opts||{};
 const r=await fetch(SB_URL+'/auth/v1'+path,Object.assign({headers:{apikey:SB_KEY,'Content-Type':'application/json'}},opts));
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||('Auth failed ('+r.status+')'));
 return d;
}
async function api(method,path,body,prefer){
 const s=ses.get(),h={apikey:SB_KEY};
 if(s&&s.access_token)h['Authorization']='Bearer '+s.access_token;
 if(body!==undefined)h['Content-Type']='application/json';
 if(prefer)h['Prefer']=prefer;
 const r=await fetch(SB_URL+'/rest/v1/'+path,{method:method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((d&&(d.message||d.hint))||('Request failed ('+r.status+')'));
 return d;
}
const R={
 get:p=>api('GET',p),
 post:(p,b)=>api('POST',p,b,'return=representation'),
 patch:(p,b)=>api('PATCH',p,b,'return=representation'),
 del:p=>api('DELETE',p)
};
let _user=null;
async function me(force){
 if(_user&&!force)return _user;
 let s=ses.get();if(!s)return null;
 if(s.expires_at*1000<Date.now()+60000){
  try{const d=await authReq('/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh_token})});ses.set(d);s=d;}
  catch(e){ses.set(null);_user=null;return null;}
 }
 try{_user=await authReq('/user',{headers:{apikey:SB_KEY,Authorization:'Bearer '+s.access_token}});}
 catch(e){_user=null;}
 return _user;
}
async function ensureProfile(u){
 const ex=await R.get('profiles?select=id&id=eq.'+u.id).catch(()=>[]);
 if(!ex||!ex.length){
  const base=((u.email||'user').split('@')[0]||'user').replace(/[^a-z0-9_]/gi,'').slice(0,30)||'user';
  await R.post('profiles',{id:u.id,username:base,display_name:base}).catch(()=>{});
 }
}
/* ============ ui helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2800);}
function fmtDur(s){s=Math.round(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function fmtDate(d){try{return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}
function stBadge(s){return '<span class="badge b-'+s+'">'+s+'</span>'}
function openModal(html){$('#modal').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';}
function closeModal(){$('#modal').innerHTML='';}
window.closeModal=closeModal;
const aboutHtml=`<footer class="about"><h3>ABOUT US</h3>
<p><b style="color:var(--gold2)">CreatorPilot AI</b> ek free AI video studio hai — prompt likho, AI script likhta hai, voice banata hai, visuals banata hai aur poori video seedha tumhare browser me render hoti hai.</p>
<p>🤖 <b>AI transparency:</b> yahan banti sabhi videos AI se generate hoti hain (Google Gemini). Tumhari API key sirf tumhare browser me rehti hai — kahin upload nahi hoti.</p>
<p style="margin-top:10px">© 2026 CreatorPilot AI Studio · Prompt se video tak.</p></footer>`;
/* ============ router ============ */
const app=()=>document.getElementById('app');
function setNav(route){
 const u=_user;
 $('#nav').innerHTML=u?`<a href="#/studio" class="${route==='studio'?'on':''}">🎬 Studio</a><a href="#/videos" class="${route==='videos'?'on':''}">📁 My Videos</a>`:'';
 $('#hact').innerHTML=u?`<button class="btn sm" onclick="openKeyModal()">🔑 API Key</button><button class="btn sm" onclick="doLogout()">Logout</button>`:'';
}
window.doLogout=async()=>{const s=ses.get();if(s)await authReq('/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+s.access_token}}).catch(()=>{});ses.set(null);_user=null;location.hash='#/login';};
function parseHash(){const h=(location.hash||'#/login').replace(/^#\/?/,'');const qi=h.indexOf('?');return{path:qi<0?h:h.slice(0,qi)};}
async function nav(){
 const{path}=parseHash();const page=(path.split('/')[0]||'login');
 if(page==='login'){const u=await me();if(u){location.hash='#/studio';return;}}
 else{const u=await me();if(!u){location.hash='#/login';return;}await ensureProfile(u);}
 setNav(page);
 try{
  if(page==='login')pgLogin();
  else if(page==='studio')pgStudio();
  else if(page==='videos')await pgVideos();
  else location.hash='#/studio';
 }catch(e){app().innerHTML='<div class="vres no"><b>Error:</b> '+esc(e.message)+'</div>'+aboutHtml;}
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',nav);
/* ============ auth: Google only ============ */
async function googleLogin(){
 const b=$('#gBtn'),e=$('#gErr');if(!b)return;b.disabled=true;e.textContent='';
 const ru=location.origin+location.pathname;
 const url=SB_URL+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(ru);
 try{
  const r=await fetch(url,{redirect:'manual',headers:{apikey:SB_KEY}});
  if(r.type!=='opaqueredirect'&&r.status>=400){
   const d=await r.json().catch(()=>({}));
   throw new Error(d.msg||d.message||d.error_description||('Auth failed ('+r.status+')'));
  }
  location.href=url;
 }catch(err){
  b.disabled=false;
  const m=String(err.message||err);
  e.textContent=(/provider|disabled|unsupported|not enabled/i.test(m))?'Google sign-in abhi setup ho raha hai — thodi der me try karo.':('Login fail: '+m);
 }
}
window.googleLogin=googleLogin;
function handleAuthReturn(){
 try{
  const h=location.hash||'';
  if(h.indexOf('access_token=')<0)return;
  const ps=Object.fromEntries(new URLSearchParams(h.charAt(0)==='#'?h.slice(1):h));
  if(ps.access_token&&ps.refresh_token){
   ses.set({access_token:ps.access_token,refresh_token:ps.refresh_token,expires_at:parseInt(ps.expires_at||'0',10),token_type:ps.token_type||'bearer'});
   history.replaceState(null,'',location.pathname+location.search+'#/studio');
   setTimeout(()=>toast('Welcome! 👋'),350);
  }
 }catch(e){}
}
/* ============ gemini client (key = user's own, localStorage only) ============ */
const LS={gk:'cp_gemini_key',gm:'cp_gemini_model',gi:'cp_gemini_img_model',gt:'cp_gemini_tts_model'};
const gkey=()=> (localStorage.getItem(LS.gk)||'').trim();
const gmodel=()=> (localStorage.getItem(LS.gm)||'').trim()||'gemini-3-flash-preview';
const gimgmodel=()=> (localStorage.getItem(LS.gi)||'').trim()||'gemini-3.1-flash-image';
const gttsmodel=()=> (localStorage.getItem(LS.gt)||'').trim()||'gemini-3.1-flash-tts-preview';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function gMsg(st,d,what){
 const m=(d&&(d.error&&d.error.message))||'';
 if(st===400)return 'API key galat hai ya model available nahi. 🔑 API Key me key check karo.'+(m?' ('+m.slice(0,120)+')':'');
 if(st===401||st===403)return 'Key reject hui (401/403) — ya to key galat hai, ya us par restriction hai, ya Gemini API enable nahi hai.'+(m?' ('+m.slice(0,120)+')':'');
 if(st===404)return 'Model nahi mila (404) — Google ne model ka naam badla ho sakta hai.';
 if(st===429)return 'Gemini free-tier quota / rate-limit khatam (429). Ye normal hai — kuch der baad Retry dabao, paise nahi lagenge.';
 if(st>=500)return 'Google server error ('+st+') — thodi der baad retry karo.';
 return (what||'Gemini')+' request fail ('+st+').'+(m?' '+m.slice(0,140):'');
}
async function gCall(model,body,what){
 const k=gkey();
 if(!k){const e=new Error('NO_KEY');e.noKey=true;throw e;}
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(gMsg(r.status,d,what));
 return d;
}
function gParts(d){try{return (((d.candidates||[])[0]||{}).content||{}).parts||[];}catch(e){return[];}}
async function gText(prompt,json){
 const body={contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.7}};
 if(json)body.generationConfig.responseMimeType='application/json';
 const d=await gCall(gmodel(),body,'Text');
 let t=gParts(d).map(p=>p.text||'').join('');
 if(!t.trim())throw new Error('Gemini se khaali jawab aaya — dobara try karo.');
 if(json){t=t.replace(/```json|```/gi,'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)t=t.slice(a,b+1);
  try{return JSON.parse(t);}catch(e){throw new Error('Gemini ne sahi JSON nahi diya — Retry dabao.');}}
 return t;
}
async function gImage(prompt){
 const d=await gCall(gimgmodel(),{contents:[{parts:[{text:prompt}]}],generationConfig:{responseModalities:['TEXT','IMAGE']}},'Image');
 const p=gParts(d).find(p=>p.inlineData&&/^image\//.test(p.inlineData.mimeType||''));
 if(!p)throw new Error('Gemini ne image nahi di (safety filter ya quota ho sakta hai) — Retry dabao.');
 return{mime:p.inlineData.mimeType,data:p.inlineData.data};
}
async function gTTS(text,voice){
 const d=await gCall(gttsmodel(),{contents:[{parts:[{text:text}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}},'Voice');
 const p=gParts(d).find(p=>p.inlineData&&/^audio\//.test(p.inlineData.mimeType||''));
 if(!p)throw new Error('Gemini ne audio nahi diya — Retry dabao.');
 return{mime:p.inlineData.mimeType,data:p.inlineData.data};
}
/* ============ media helpers ============ */
function b64ToBlob(b64,mime){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime});}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Image load fail'));i.src=src;});}
async function audioBuf(url){
 const AC=audioBuf._c||(audioBuf._c=new (window.AudioContext||window.webkitAudioContext)());
 if(AC.state==='suspended'){try{await AC.resume();}catch(e){}}
 const ab=await (await fetch(url)).arrayBuffer();
 return{ac:AC,buf:await AC.decodeAudioData(ab)};
}
function drawCoverCtx(x,img,W,H,zoom,panX,alpha){
 if(alpha!=null)x.globalAlpha=alpha;
 const ir=img.width/img.height,cr=W/H;let bw,bh;
 if(ir>cr){bh=H*(zoom||1);bw=bh*ir;}else{bw=W*(zoom||1);bh=bw/ir;}
 x.drawImage(img,(W-bw)/2+(panX||0)*W,(H-bh)/2,bw,bh);
 if(alpha!=null)x.globalAlpha=1;
}
function splitLen(text,max){
 const words=String(text||'').split(/\s+/).filter(Boolean),out=[];let cur='';
 for(const w of words){if((cur+' '+w).trim().length>max){if(cur)out.push(cur.trim());cur=w;}else cur+=' '+w;}
 if(cur.trim())out.push(cur.trim());return out.length?out:[text||'…'];
}
function cuesFromScenes(scenes){
 const cues=[];
 for(const s of scenes){
  const chunks=splitLen(s.narration,42);
  const dur=(Number(s.end)-Number(s.start))/chunks.length;
  chunks.forEach((c,i)=>cues.push({start:Number(s.start)+i*dur,end:Number(s.start)+(i+1)*dur,text:c}));
 }
 return cues;
}
function ttsText(nar){
 return String(nar||'').split('\n').map(l=>l.replace(/^[A-Z\u0900-\u0975][A-Z\u0900-\u0975\s.'’-]{1,24}:\s*/,'').trim()).filter(Boolean).join(' ');
}

async function stScript(J){
 const n=Math.max(1,Math.round(J.dur/5));
 const pr=await gText('You are a YouTube scriptwriter. Write a short, engaging video script in Hindi on: "'+J.prompt+'".\nMake exactly '+n+' scenes, each about 5 seconds ('+J.dur+'s total).\nRules:\n- Strong hook in the first 3 seconds.\n- One idea per scene; dialogue lines may start with SPEAKER: (e.g. ALOO: ...).\n- Caption: short and punchy (under 40 characters).\n- Visual: detailed image description — character, action, environment, lighting.\nReply ONLY as JSON: {"scenes":[{"narration":"...","visual":"...","caption":"..."}]}. No markdown, no extra text.',true);
 const list=(pr.scenes||[]).slice(0,n);
 if(!list.length)throw new Error('Gemini ne scenes nahi diye — Retry dabao.');
 while(list.length<n)list.push({narration:list[list.length-1].narration,visual:list[list.length-1].visual,caption:list[list.length-1].caption});
 const per=J.dur/n;let t=0;
 J.scenes=list.map((s,i)=>{const o={n:i+1,start:+t.toFixed(2),end:+(t+per).toFixed(2),narration:String(s.narration||'').trim(),visual:String(s.visual||'').trim(),caption:String(s.caption||'').trim()};t+=per;return o;});
 if(!J.scenes.every(s=>s.narration&&s.visual))throw new Error('Kuch scenes adhoore aaye — Retry dabao.');
}
async function stVoice(J){
 const voice=J.voice==='male'?'Charon':'Aoede';
 let shift=0;
 for(let i=0;i<J.scenes.length;i++){
  const s=J.scenes[i];
  const txt=ttsText(s.narration);
  if(!txt)throw new Error('Scene '+(i+1)+' me narration khaali hai.');
  const au=await gTTS(txt,voice);
  const blob=b64ToBlob(au.data,au.mime);
  const url=URL.createObjectURL(blob);
  let r;try{r=await audioBuf(url);}catch(e){throw new Error('Scene '+(i+1)+' audio decode fail — Retry dabao.');}
  const dur=r.buf.duration;
  J.audioBufs.push(r.buf);
  s.start=+(s.start+shift).toFixed(2);s.end=+(s.end+shift).toFixed(2);
  if(dur>(s.end-s.start)+0.3){const delta=dur-(s.end-s.start)+0.5;s.end=+(s.end+delta).toFixed(2);shift+=delta;}
  pStage('voice','on','🎙️ Voice: scene '+(i+1)+'/'+J.scenes.length);
  await sleep(900);
 }
 J.total=+J.scenes[J.scenes.length-1].end.toFixed(2);
}

/* ---------- canvas renderer (Ken Burns + burned captions + Web Audio sync) ---------- */
async function renderVideo(J,onProg){
 const scenes=J.scenes;
 if(!scenes.length)throw new Error('Scenes missing hain.');
 if(J.imgEls.length!==scenes.length||J.audioBufs.length!==scenes.length)throw new Error('Visuals/voice adhoore hain — Retry dabao.');
 const caps=cuesFromScenes(scenes);
 const dims=DIMS[J.ratio]||DIMS['16:9'],W=dims[0],H=dims[1];
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;
 const cx=cv.getContext('2d');
 const AC=audioBuf._c;
 if(!AC)throw new Error('Audio system ready nahi — Voice stage dobara chalao.');
 const dest=AC.createMediaStreamDestination();
 const t0=AC.currentTime+0.4;
 scenes.forEach((s,i)=>{
  const src=AC.createBufferSource();src.buffer=J.audioBufs[i];
  src.connect(dest);try{src.connect(AC.destination);}catch(e){}
  src.start(Math.max(t0,t0+s.start));
 });
 const stream=cv.captureStream(30);
 const tracks=stream.getVideoTracks().concat(dest.stream.getAudioTracks());
 if(!tracks.length)throw new Error('Canvas capture fail — browser support check karo.');
 const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
 if(!mime)throw new Error('Is browser me MediaRecorder/webm support nahi hai.');
 const rec=new MediaRecorder(new MediaStream(tracks),{mimeType:mime,videoBitsPerSecond:J.ratio==='9:16'?6000000:8000000});
 const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
 const doneP=new Promise(res=>{rec.onstop=res;});
 rec.start(500);
 const total=J.total;
 let lastPct=-1;
 const fs=Math.round(W/16);
 await new Promise(resolve=>{
  function frame(){
   const t=AC.currentTime-t0;
   if(t>=total){resolve();return;}
   let idx=scenes.findIndex(s=>t>=s.start&&t<s.end);
   if(idx<0)idx=t<scenes[0].start?0:scenes.length-1;
   const s=scenes[idx];
   const k=Math.min(1,Math.max(0,(t-s.start)/Math.max(0.01,(s.end-s.start))));
   cx.fillStyle='#000';cx.fillRect(0,0,W,H);
   drawCoverCtx(cx,J.imgEls[idx],W,H,1+0.12*k,(k-0.5)*0.08);
   const XF=0.6;
   if(idx<scenes.length-1&&t>s.end-XF)drawCoverCtx(cx,J.imgEls[idx+1],W,H,1,0,(t-(s.end-XF))/XF);
   const cue=caps.find(c=>t>=c.start&&t<c.end);
   const capText=cue?cue.text:(s.caption||'');
   if(capText){
    const lines=splitLen(capText,34).slice(-2);
    cx.font='800 '+fs+'px system-ui,-apple-system,sans-serif';cx.textAlign='center';cx.textBaseline='bottom';
    const lh=fs*1.28,y0=H*0.90;
    lines.forEach((ln,i)=>{
     const y=y0-(lines.length-1-i)*lh;
     cx.lineWidth=Math.max(4,Math.round(fs/7));cx.strokeStyle='rgba(0,0,0,0.88)';cx.lineJoin='round';
     cx.strokeText(ln,W/2,y);cx.fillStyle='#fff';cx.fillText(ln,W/2,y);
    });
   }
   const pct=Math.max(0,Math.min(99,Math.round(t/total*100)));
   if(pct!==lastPct){lastPct=pct;if(onProg)onProg(pct);}
   requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
 });
 rec.stop();await doneP;
 const blob=new Blob(chunks,{type:'video/webm'});
 const url=URL.createObjectURL(blob);
 return{url:url,blob:blob,total:total};
}
