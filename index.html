<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CreatorPilot — Prompt se Video</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--card3:#3a3a3c;--line:#2e2e32;--txt:#fff;--mut:#a1a1a6;--dim:#6e6e73;--ok:#3ecf6e;--bad:#ff5d5d;--purple:#a259ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 150px}
/* ---------- home ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px}
.topbar h1{font-size:29px;font-weight:600;letter-spacing:-.5px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#b06cff,#7c3aed);color:#fff;font-weight:700;font-size:20px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 8px}
.sec-head h2{font-size:25px;font-weight:500}
.pill-new{background:var(--card);color:var(--txt);border:none;border-radius:999px;padding:13px 24px;font-size:16px;font-weight:500;cursor:pointer}
.pill-new:active{background:var(--card2)}
.prow{display:flex;align-items:center;gap:15px;padding:12px 0;cursor:pointer}
.pth{width:112px;height:112px;border-radius:22px;object-fit:cover;background:var(--card);flex:none;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--dim)}
.pmeta{flex:1;min-width:0}
.ptitle{font-size:17px;font-weight:500;margin-bottom:7px}
.pcounts{display:flex;gap:16px;color:var(--dim);font-size:14px}
.pdots{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:8px;letter-spacing:2px}
.menu-pop{position:fixed;z-index:200;background:var(--card2);border-radius:16px;padding:6px;min-width:170px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);padding:13px 16px;font-size:15px;border-radius:10px;cursor:pointer}
.menu-pop button:active{background:var(--card3)}
.menu-pop button.danger{color:var(--bad)}
/* ---------- project header ---------- */
.ph{display:flex;align-items:center;gap:12px;padding:14px 0}
.backbtn{width:50px;height:50px;border-radius:16px;background:var(--card);border:none;color:var(--txt);font-size:22px;cursor:pointer;flex:none}
.ph h2{font-size:20px;font-weight:500;flex:1}
.ph .icbtn{width:50px;height:50px;border-radius:16px;background:var(--card);border:none;color:var(--txt);font-size:20px;cursor:pointer;flex:none}
/* ---------- empty state ---------- */
.empty{padding:70px 20px 30px;text-align:center;color:var(--dim)}
.empty .t1{font-size:16px;margin-bottom:6px}
.empty .t2{font-size:15px;margin-bottom:26px}
.upload-pill{background:var(--card);border:none;color:var(--txt);border-radius:999px;padding:14px 30px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:9px}
/* ---------- assets grid ---------- */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 0 20px}
.acard{background:var(--card);border-radius:20px;overflow:hidden}
.acard img,.acard video{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:#000}
.acard .am{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.acard .am span{font-size:12.5px;color:var(--mut)}
.dl{background:var(--card2);border:none;color:var(--txt);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer}
.sess-note{text-align:center;color:var(--dim);font-size:12.5px;padding:4px 16px 18px}
/* ---------- prompt bar ---------- */
.pbar-wrap{position:fixed;left:0;right:0;bottom:0;z-index:100;padding:8px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 35%);pointer-events:none}
.pbar{pointer-events:auto;max-width:760px;margin:0 auto;background:var(--card);border-radius:30px;padding:18px 16px 13px;box-shadow:0 -6px 30px rgba(0,0,0,.5)}
.pbar textarea{width:100%;background:none;border:none;outline:none;color:var(--txt);font-size:21px;font-family:inherit;resize:none;min-height:34px;max-height:130px}
.pbar textarea::placeholder{color:var(--mut)}
.pbar-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.plusbtn{width:44px;height:44px;border-radius:50%;background:none;border:none;color:var(--txt);font-size:30px;font-weight:300;cursor:pointer;line-height:1}
.modechip{background:var(--card2);border:1px solid var(--card3);color:var(--txt);border-radius:999px;padding:11px 18px;font-size:15px;cursor:pointer;margin-left:auto}
.sendbtn{width:52px;height:52px;border-radius:50%;background:var(--card2);border:none;color:var(--txt);font-size:22px;cursor:pointer;flex:none}
.sendbtn.ready{background:#fff;color:#000}
/* ---------- progress ---------- */
.gprog{max-width:760px;margin:0 auto 10px;background:var(--card);border-radius:20px;padding:14px 16px;display:none;pointer-events:auto}
.gprog.show{display:block}
.gp-top{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mut);margin-bottom:8px}
.gp-bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden}
.gp-bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .3s}
.gp-msg{font-size:13px;color:var(--mut);margin-top:8px}
.gp-msg.err{color:var(--bad)}
/* ---------- bottom sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.65);display:none}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:151;background:var(--card);border-radius:26px 26px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;transform:translateY(105%);transition:transform .28s ease;max-height:82vh;overflow-y:auto}
.sheet-bg.show+.sheet{transform:none}
.grab{width:44px;height:5px;border-radius:99px;background:var(--card3);margin:2px auto 12px}
.sheet-top{text-align:center;color:var(--mut);font-size:13.5px;margin-bottom:14px}
.tabs{display:flex;background:#101012;border-radius:18px;padding:5px;margin-bottom:6px}
.tabs button{flex:1;background:none;border:none;color:var(--mut);border-radius:13px;padding:13px;font-size:16px;font-weight:500;cursor:pointer}
.tabs button.on{background:var(--card3);color:var(--txt)}
.optlbl{color:var(--mut);font-size:13px;margin:14px 2px 8px}
.ratios{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#101012;border-radius:18px;padding:10px 6px}
.ratio{background:none;border:none;color:var(--mut);cursor:pointer;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px}
.ratio.on{background:var(--card3);color:var(--txt)}
.ar-ic{border:2px solid currentColor;border-radius:3px;display:block}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#101012;border-radius:18px;padding:6px}
.counts button{background:none;border:none;color:var(--mut);border-radius:13px;padding:14px;font-size:16px;cursor:pointer}
.counts button.on{background:var(--card3);color:var(--txt)}
.seg2{display:flex;gap:6px;background:#101012;border-radius:18px;padding:6px}
.seg2 button{flex:1;background:none;border:none;color:var(--mut);border-radius:13px;padding:13px;font-size:15px;cursor:pointer}
.seg2 button.on{background:var(--card3);color:var(--txt)}
.modelrow{width:100%;margin-top:14px;background:#101012;border:none;color:var(--txt);border-radius:18px;padding:16px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
/* ---------- account ---------- */
.acct-card{background:var(--card);border-radius:22px;padding:20px;margin:14px 0;display:flex;align-items:center;gap:15px}
.acct-card .avatar{width:58px;height:58px;font-size:24px}
.acct-name{font-size:18px;font-weight:600}
.acct-mail{color:var(--mut);font-size:14px;margin-top:2px;word-break:break-all}
.freebadge{display:inline-block;background:var(--card3);color:var(--txt);border-radius:8px;padding:3px 12px;font-size:12.5px;font-weight:600;margin-top:8px;letter-spacing:.5px}
.rows-card{background:var(--card);border-radius:22px;margin:14px 0;overflow:hidden}
.arow{width:100%;display:flex;align-items:center;gap:14px;background:none;border:none;color:var(--txt);padding:19px 20px;font-size:16px;cursor:pointer;text-align:left}
.arow+.arow{border-top:1px solid var(--line)}
.arow .ri{font-size:20px;width:28px;text-align:center;flex:none}
.arow.danger{color:var(--bad)}
.arow .tx{flex:1}
.arow .sub{display:block;font-size:12.5px;color:var(--dim);margin-top:2px}
/* ---------- login ---------- */
.login-wrap{max-width:420px;margin:0 auto;padding:90px 24px 40px;text-align:center}
.login-wrap h1{font-size:44px;font-weight:700;letter-spacing:-1px;margin-bottom:10px}
.login-wrap .tag{color:var(--mut);font-size:19px;margin-bottom:44px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#fff;color:#1f1f1f;border:none;border-radius:999px;padding:16px;font-size:17px;font-weight:600;cursor:pointer}
.gbtn:disabled{opacity:.6}
.g-ic{width:22px;height:22px}
.errline{color:var(--bad);font-size:13.5px;margin-top:14px;min-height:20px}
/* ---------- modal / toast ---------- */
#modal:empty{display:none}
.modal-bg{position:fixed;inset:0;z-index:180;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:86vh;overflow-y:auto}
.modal h2{font-size:20px;margin-bottom:8px}
.field{margin:14px 0}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:7px}
.inp{width:100%;background:#101012;border:1px solid var(--line);border-radius:14px;color:var(--txt);padding:14px;font-size:15px;font-family:inherit;outline:none}
.inp:focus{border-color:var(--dim)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mbtn{background:var(--card2);border:none;color:var(--txt);border-radius:999px;padding:12px 20px;font-size:14.5px;cursor:pointer}
.mbtn.primary{background:#fff;color:#000;font-weight:600}
.mbtn.danger{color:var(--bad)}
.note{font-size:13px;color:var(--mut);margin-top:14px;line-height:1.6}
.note a{color:#fff;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:300;background:var(--card2);color:var(--txt);padding:13px 22px;border-radius:999px;font-size:14.5px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:88vw;text-align:center}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:24px}.topbar h1{font-size:32px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="pbar-wrap" id="pbarWrap" style="display:none">
  <div class="gprog" id="gprog"><div class="gp-top"><span id="gpStage">Starting…</span><span id="gpPct">0%</span></div><div class="gp-bar"><i id="gpBar"></i></div><div class="gp-msg" id="gpMsg"></div></div>
  <div class="pbar">
    <textarea id="pInput" rows="1" placeholder="What do you want to make?"></textarea>
    <div class="pbar-row">
      <button class="plusbtn" id="plusBtn" aria-label="options">+</button>
      <button class="modechip" id="modeChip">🎬 ▾ x1</button>
      <button class="sendbtn" id="sendBtn" aria-label="send">→</button>
    </div>
  </div>
</div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div id="modal"></div>
<input type="file" id="upFile" accept="image/*" multiple style="display:none">
<script>
'use strict';
/* ============ config ============ */
const SB_URL='https://jhpimqhbbbzuglhpnxha.supabase.co';
const SB_KEY='sb_publishable_bw_b2sOM1UUuWCuPb3yyQQ_6BonzaBi';
/* ============ tiny supabase client (fetch; no dependency) ============ */
const ses={
 get(){try{return JSON.parse(localStorage.getItem('cp_session')||'null')}catch(e){return null}},
 set(v){v?localStorage.setItem('cp_session',JSON.stringify(v)):localStorage.removeItem('cp_session')}
};
async function authReq(path,opts){
 opts=opts||{};
 const r=await fetch(SB_URL+'/auth/v1'+path,Object.assign({headers:{apikey:SB_KEY,'Content-Type':'application/json'}},opts));
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||('Auth failed ('+r.status+')'));
 return d;
}
async function api(method,path,body,prefer){
 const s=ses.get(),h={apikey:SB_KEY};
 if(s&&s.access_token)h['Authorization']='Bearer '+s.access_token;
 if(body!==undefined)h['Content-Type']='application/json';
 if(prefer)h['Prefer']=prefer;
 const r=await fetch(SB_URL+'/rest/v1/'+path,{method:method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((d&&(d.message||d.hint))||('Request failed ('+r.status+')'));
 return d;
}
const R={
 get:p=>api('GET',p),
 post:(p,b)=>api('POST',p,b,'return=representation'),
 patch:(p,b)=>api('PATCH',p,b,'return=representation'),
 del:p=>api('DELETE',p)
};
let _user=null;
async function me(force){
 if(_user&&!force)return _user;
 let s=ses.get();if(!s)return null;
 if(s.expires_at*1000<Date.now()+60000){
  try{const d=await authReq('/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh_token})});ses.set(d);s=d;}
  catch(e){ses.set(null);_user=null;return null;}
 }
 try{_user=await authReq('/user',{headers:{apikey:SB_KEY,Authorization:'Bearer '+s.access_token}});}
 catch(e){_user=null;}
 return _user;
}
async function ensureProfile(u){
 const ex=await R.get('profiles?select=id&id=eq.'+u.id).catch(()=>[]);
 if(!ex||!ex.length){
  const base=((u.email||'user').split('@')[0]||'user').replace(/[^a-z0-9_]/gi,'').slice(0,30)||'user';
  await R.post('profiles',{id:u.id,username:base,display_name:base}).catch(()=>{});
 }
}
/* ============ ui helpers ============ */
const $=s=>document.querySelector(s);
const app=()=>document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2800);}
function fmtDT(d){try{let s=new Date(d).toLocaleString('en-US',{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:true});return s.replace('AM','am').replace('PM','pm');}catch(e){return''}}
function openModal(html){$('#modal').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';}
function closeModal(){$('#modal').innerHTML='';}
window.closeModal=closeModal;
function userName(){const u=_user||{};const m=u.user_metadata||{};return m.full_name||m.name||(u.email||'U').split('@')[0];}
/* ============ auth: Google only ============ */
async function googleLogin(){
 const b=$('#gBtn'),e=$('#gErr');if(b)b.disabled=true;if(e)e.textContent='';
 const ru=location.origin+location.pathname;
 const url=SB_URL+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(ru);
 try{
  const r=await fetch(url,{redirect:'manual',headers:{apikey:SB_KEY}});
  if(r.type!=='opaqueredirect'&&r.status>=400){
   const d=await r.json().catch(()=>({}));
   throw new Error(d.msg||d.message||d.error_description||('Auth failed ('+r.status+')'));
  }
  location.href=url;
 }catch(err){
  if(b)b.disabled=false;
  const m=String(err.message||err);
  if(e)e.textContent=(/provider|disabled|unsupported|not enabled/i.test(m))?'Google sign-in abhi setup ho raha hai — thodi der me try karo.':('Login fail: '+m);
 }
}
window.googleLogin=googleLogin;
window.doLogout=async()=>{const s=ses.get();if(s)await authReq('/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+s.access_token}}).catch(()=>{});ses.set(null);_user=null;location.hash='#/login';};
function handleAuthReturn(){
 try{
  const h=location.hash||'';
  if(h.indexOf('access_token=')<0)return;
  const ps=Object.fromEntries(new URLSearchParams(h.charAt(0)==='#'?h.slice(1):h));
  if(ps.access_token&&ps.refresh_token){
   ses.set({access_token:ps.access_token,refresh_token:ps.refresh_token,expires_at:parseInt(ps.expires_at||'0',10),token_type:ps.token_type||'bearer'});
   history.replaceState(null,'',location.pathname+location.search+'#/');
   setTimeout(()=>toast('Welcome! 👋'),350);
  }
 }catch(e){}
}
/* ============ gemini client (key = user's own, localStorage only) ============ */
const LS={gk:'cp_gemini_key',gm:'cp_gemini_model',gi:'cp_gemini_img_model',gt:'cp_gemini_tts_model'};
const gkey=()=> (localStorage.getItem(LS.gk)||'').trim();
const DEAD_MODELS=['gemini-2.0-flash','gemini-2.0-flash-lite','gemini-2.0-flash-preview-image-generation','gemini-2.5-flash-preview-tts','gemini-2.5-pro-preview-tts','gemini-3-flash-preview','gemini-3.1-flash-tts-preview','gemini-3-pro-preview','gemini-3-pro-image-preview'];
function gpick(k,def){let v=(localStorage.getItem(k)||'').trim();if(v&&DEAD_MODELS.indexOf(v)>=0){try{localStorage.removeItem(k);}catch(e){}v='';}return v||def;}
const gmodel=()=> gpick(LS.gm,'gemini-3.8-flash');
const gimgmodel=()=> gpick(LS.gi,'gemini-3.1-flash-image');
const gttsmodel=()=> gpick(LS.gt,'gemini-3.8-flash-tts');
const FALLBACKS={text:['gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash'],img:['gemini-3.1-flash-image','gemini-3.1-flash-lite-image','gemini-3-pro-image','gemini-2.5-flash-image'],tts:['gemini-3.8-flash-tts','gemini-3.8-flash-lite-tts','gemini-2.5-flash-preview-tts']};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function gMsg(st,d,what){
 const m=(d&&(d.error&&d.error.message))||'';
 if(st===400)return 'API key galat hai ya model available nahi. 🔑 API key check karo.'+(m?' ('+m.slice(0,120)+')':'');
 if(st===401||st===403)return 'Key reject hui (401/403) — ya to key galat hai, ya us par restriction hai, ya Gemini API enable nahi hai.'+(m?' ('+m.slice(0,120)+')':'');
 if(st===404)return 'Model nahi mila (404) — Google ne model ka naam badla ho sakta hai. 🔑 API key settings me model naam check karo.';
 if(st===429)return 'Gemini free-tier quota / rate-limit khatam (429). Ye normal hai — kuch der baad Retry dabao, paise nahi lagenge.';
 if(st>=500)return 'Google server error ('+st+') — thodi der baad retry karo.';
 return (what||'Gemini')+' request fail ('+st+').'+(m?' '+m.slice(0,140):'');
}
async function gCall(model,body,what){
 const k=gkey();
 if(!k){const e=new Error('NO_KEY');e.noKey=true;throw e;}
 const waits=[8000,20000,45000];let att=0;
 while(true){
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json().catch(()=>({}));
 if(r.status===429&&att<waits.length){
  let w=waits[att++];try{const ra=r.headers.get('retry-after');const n=parseInt(ra,10);if(n>0&&n<=120)w=n*1000;}catch(e){}
  let cp=0;try{cp=parseInt(($('#gpPct')||{}).textContent)||0;}catch(e){}
  for(let t=Math.ceil(w/1000);t>0;t--){try{gpSet(cp,(what||'Gemini'),'⏳ Quota full — '+t+'s me auto-retry...');}catch(e){}await sleep(1000);}
  continue;}
 if(!r.ok){const e=new Error(gMsg(r.status,d,what));e.status=r.status;throw e;}
 return d;
 }
}
async function gCallAuto(kind,body,what){const cur=kind==='text'?gmodel():kind==='img'?gimgmodel():gttsmodel();const lk=kind==='text'?LS.gm:kind==='img'?LS.gi:LS.gt;const cands=[];[cur].concat(FALLBACKS[kind]).forEach(function(m){if(cands.indexOf(m)<0)cands.push(m);});let last=null;for(const m of cands){try{const d=await gCall(m,body,what);if(m!==cur){try{localStorage.setItem(lk,m);}catch(e){}}return d;}catch(e){if(e&&e.status===404){last=e;continue;}throw e;}}throw last;}
function gParts(d){try{return (((d.candidates||[])[0]||{}).content||{}).parts||[];}catch(e){return[];}}
async function gText(prompt,json){
 const body={contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.7}};
 if(json)body.generationConfig.responseMimeType='application/json';
 const d=await gCallAuto('text',body,'Text');
 let t=gParts(d).map(p=>p.text||'').join('');

async function iCall(body){
 const k=gkey();
 if(!k){const e=new Error('NO_KEY');e.noKey=true;throw e;}
 const waits=[8000,20000,45000];let att=0;
 while(true){
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify(body)});
 const d=await r.json().catch(()=>({}));
 if(r.status===429&&att<waits.length){
  let w=waits[att++];try{const ra=r.headers.get('retry-after');const n=parseInt(ra,10);if(n>0&&n<=120)w=n*1000;}catch(e){}
  let cp=0;try{cp=parseInt(($('#gpPct')||{}).textContent)||0;}catch(e){}
  for(let t=Math.ceil(w/1000);t>0;t--){try{gpSet(cp,'Gemini','⏳ Quota full — '+t+'s me auto-retry...');}catch(e){}await sleep(1000);}
  continue;}
 if(!r.ok){const e=new Error(gMsg(r.status,d,'Gemini'));e.status=r.status;throw e;}
 return d;
 }
}
function iContent(d,type){
 try{
  const steps=d.steps||[];
  for(let s=steps.length-1;s>=0;s--){const c=steps[s].content||[];for(let i=c.length-1;i>=0;i--){if(c[i]&&c[i].type===type&&c[i].data)return c[i];}}
  if(type==='image'&&d.output_image&&d.output_image.data)return{data:d.output_image.data,mime_type:'image/png'};
  if(type==='audio'&&d.output_audio&&d.output_audio.data)return{data:d.output_audio.data,mime_type:'audio/wav'};
 }catch(e){}
 return null;
}
async function iCallAuto(kind,body){
 const cur=kind==='img'?gimgmodel():gttsmodel();const lk=kind==='img'?LS.gi:LS.gt;
 const cands=[];[cur].concat(FALLBACKS[kind]).forEach(function(m){if(cands.indexOf(m)<0)cands.push(m);});
 let last=null;
 for(const m of cands){try{const dd={};for(const kk in body)dd[kk]=body[kk];dd.model=m;const d=await iCall(dd);if(m!==cur){try{localStorage.setItem(lk,m);}catch(e){}}return d;}catch(e){if(e&&e.status===404){last=e;continue;}throw e;}}
 throw last;
}

function drawCoverCtx(x,img,W,H,zoom,panX,alpha){
 if(alpha!=null)x.globalAlpha=alpha;
 const ir=img.width/img.height,cr=W/H;let bw,bh;
 if(ir>cr){bh=H*(zoom||1);bw=bh*ir;}else{bw=W*(zoom||1);bh=bw/ir;}
 x.drawImage(img,(W-bw)/2+(panX||0)*W,(H-bh)/2,bw,bh);
 if(alpha!=null)x.globalAlpha=1;
}
function splitLen(text,max){
 const words=String(text||'').split(/\s+/).filter(Boolean),out=[];let cur='';
 for(const w of words){if((cur+' '+w).trim().length>max){if(cur)out.push(cur.trim());cur=w;}else cur+=' '+w;}
 if(cur.trim())out.push(cur.trim());return out.length?out:[text||'…'];
}
function cuesFromScenes(scenes){
 const cues=[];
 for(const s of scenes){
  const chunks=splitLen(s.narration,42);
  const dur=(Number(s.end)-Number(s.start))/chunks.length;
  chunks.forEach((c,i)=>cues.push({start:Number(s.start)+i*dur,end:Number(s.start)+(i+1)*dur,text:c}));
 }
 return cues;
}

  await R.patch('projects?id=eq.'+curPid,{status:'completed',progress:100}).catch(()=>{});
  gpSet(100,'Done 🎉','Ho gaya! Neeche download kar lo.');
  setTimeout(()=>gpShow(false),2500);
  toast('🎉 Ready!');
 }catch(e){
  const msg=e.noKey?'Pehle 🔑 API key add karo (Account page)':e.message;
  gpSet(0,'Failed',msg,true);
  await R.patch('projects?id=eq.'+curPid,{status:'failed'}).catch(()=>{});
 }
 running=false;
}
async function genImages(prompt){
 for(let v=0;v<UI.count;v++){
  gpSet(Math.round(v/UI.count*100),'🖼 Image '+(v+1)+'/'+UI.count,'Image ban rahi hai...');
  const im=await gImage(prompt+'. '+RHINT[UI.ratio]+'. '+(v>0?'(variation '+(v+1)+': different angle and lighting) ':'')+'No text, no words, no watermark anywhere in the image.');
  const url=URL.createObjectURL(b64ToBlob(im.data,im.mime));
  sessionAssets[curPid].push({type:'image',url:url});
  renderAssets();
  await sleep(900);
 }
}
async function genVideos(prompt){
 const n=Math.max(1,Math.round(UI.dur/5)),per=UI.dur/n;
 for(let v=0;v<UI.count;v++){
  const tag=UI.count>1?(' (variation '+(v+1)+'/'+UI.count+')'):'';
  gpSet(Math.round(v/UI.count*100),'✍️ Script'+tag,'Script likhi ja rahi hai...');
  const pr=await gText('You are a YouTube scriptwriter. Write a short, engaging video script in Hindi on: "'+prompt+'".\nMake exactly '+n+' scenes, each about 5 seconds ('+UI.dur+'s total).\nRules:\n- Strong hook in the first 3 seconds.\n- One idea per scene; dialogue lines may start with a SPEAKER label in caps followed by a colon.\n- Caption: short and punchy (under 40 characters).\n- Visual: detailed image description — character, action, environment, lighting.'+(v>0?'\n- This is variation '+(v+1)+': use different camera angles, lighting and compositions than usual.':'')+'\nReply ONLY as JSON: {"scenes":[{"narration":"...","visual":"...","caption":"..."}]}. No markdown, no extra text.',true);
  const list=(pr.scenes||[]).slice(0,n);
  if(!list.length)throw new Error('Gemini ne scenes nahi diye — dobara try karo.');
  while(list.length<n)list.push({narration:list[list.length-1].narration,visual:list[list.length-1].visual,caption:list[list.length-1].caption});
  let t=0;
  const scenes=list.map(s=>{const o={narration:String(s.narration||'').trim(),visual:String(s.visual||'').trim(),caption:String(s.caption||'').trim(),start:+t.toFixed(2),end:+(t+per).toFixed(2)};t+=per;return o;});
  if(!scenes.every(s=>s.narration&&s.visual))throw new Error('Kuch scenes adhoore aaye — dobara try karo.');
  // voice
  const voice=UI.voice==='male'?'Puck':'Kore';
  const audioBufs=[];let shift=0;
  for(let i=0;i<scenes.length;i++){
   const s=scenes[i],txt=ttsText(s.narration);
   if(!txt)throw new Error('Scene '+(i+1)+' me narration khaali hai.');
   gpSet(Math.round((v+i/scenes.length)/UI.count*100),'🎙️ Voice'+tag,'Scene '+(i+1)+'/'+scenes.length+' ki voice...');
   const au=await gTTS(txt,voice);
   const url=URL.createObjectURL(b64ToBlob(au.data,au.mime));
   let r;try{r=await audioBuf(url);}catch(e){throw new Error('Scene '+(i+1)+' audio decode fail — dobara try karo.');}
   const dur=r.buf.duration;audioBufs.push(r.buf);
   s.start=+(s.start+shift).toFixed(2);s.end=+(s.end+shift).toFixed(2);
   if(dur>(s.end-s.start)+0.3){const delta=dur-(s.end-s.start)+0.5;s.end=+(s.end+delta).toFixed(2);shift+=delta;}
   await sleep(800);
  }
  const total=+scenes[scenes.length-1].end.toFixed(2);
  // visuals
  const imgEls=[];
  const charNote='CHARACTER CONSISTENCY: keep the exact same character design (face, clothes, colors) across all scenes of this video about "'+prompt.slice(0,80)+'".';
  for(let i=0;i<scenes.length;i++){
   gpSet(Math.round((v+i/scenes.length)/UI.count*100),'🖼️ Visuals'+tag,'Scene '+(i+1)+'/'+scenes.length+' ki image...');
   const im=await gImage(scenes[i].visual+'. 3D cartoon style. '+RHINT[UI.ratio]+'. '+charNote+(v>0?' Variation '+(v+1)+': different camera angle and lighting.':'')+' No text, no words, no watermark anywhere in the image.');
   imgEls.push(await loadImg(URL.createObjectURL(b64ToBlob(im.data,im.mime))));
   await sleep(1000);
  }
  // render
  gpSet(Math.round(v/UI.count*100),'🎬 Render'+tag,'Render ho raha hai — tab khula rakho...');
  const J={scenes:scenes,imgEls:imgEls,audioBufs:audioBufs,total:total,ratio:UI.ratio};
  const res=await renderVideo(J,pct=>gpSet(Math.round((v+pct/100)/UI.count*100),'🎬 Render'+tag,pct+'% — tab khula rakho...'));
  sessionAssets[curPid].push({type:'video',url:res.url});
  renderAssets();
 }
}
async function renderVideo(J,onProg){
 const scenes=J.scenes;
 if(!scenes.length)throw new Error('Scenes missing hain.');
 if(J.imgEls.length!==scenes.length||J.audioBufs.length!==scenes.length)throw new Error('Visuals/voice adhoore hain — dobara try karo.');
 const caps=cuesFromScenes(scenes);
 const dims=RDIMS[J.ratio]||RDIMS['9:16'],W=dims[0],H=dims[1];
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;
 const cx=cv.getContext('2d');
 const AC=audioBuf._c;
 if(!AC)throw new Error('Audio system ready nahi — dobara try karo.');
 const dest=AC.createMediaStreamDestination();
 const t0=AC.currentTime+0.4;
 scenes.forEach((s,i)=>{
  const src=AC.createBufferSource();src.buffer=J.audioBufs[i];
  src.connect(dest);try{src.connect(AC.destination);}catch(e){}
  src.start(Math.max(t0,t0+s.start));
 });
 const stream=cv.captureStream(30);
 const tracks=stream.getVideoTracks().concat(dest.stream.getAudioTracks());
 if(!tracks.length)throw new Error('Canvas capture fail — browser support check karo.');
 const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
 if(!mime)throw new Error('Is browser me MediaRecorder/webm support nahi hai.');
 const rec=new MediaRecorder(new MediaStream(tracks),{mimeType:mime,videoBitsPerSecond:6000000});
 const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
 const doneP=new Promise(res=>{rec.onstop=res;});
 rec.start(500);
 const total=J.total;
 let lastPct=-1;
 const fs=Math.round(W/16);
 await new Promise(resolve=>{
  function frame(){
   const t=AC.currentTime-t0;
   if(t>=total){resolve();return;}
   let idx=scenes.findIndex(s=>t>=s.start&&t<s.end);
   if(idx<0)idx=t<scenes[0].start?0:scenes.length-1;
   const s=scenes[idx];
   const k=Math.min(1,Math.max(0,(t-s.start)/Math.max(0.01,(s.end-s.start))));
   cx.fillStyle='#000';cx.fillRect(0,0,W,H);
   drawCoverCtx(cx,J.imgEls[idx],W,H,1+0.12*k,(k-0.5)*0.08);
   const XF=0.6;
   if(idx<scenes.length-1&&t>s.end-XF)drawCoverCtx(cx,J.imgEls[idx+1],W,H,1,0,(t-(s.end-XF))/XF);
   const cue=caps.find(c=>t>=c.start&&t<c.end);
   const capText=cue?cue.text:(s.caption||'');
   if(capText){
    const lines=splitLen(capText,34).slice(-2);
    cx.font='800 '+fs+'px system-ui,-apple-system,sans-serif';cx.textAlign='center';cx.textBaseline='bottom';
    const lh=fs*1.28,y0=H*0.90;
    lines.forEach((ln,i)=>{
     const y=y0-(lines.length-1-i)*lh;
     cx.lineWidth=Math.max(4,Math.round(fs/7));cx.strokeStyle='rgba(0,0,0,0.88)';cx.lineJoin='round';
     cx.strokeText(ln,W/2,y);cx.fillStyle='#fff';cx.fillText(ln,W/2,y);
    });
   }
   const pct=Math.max(0,Math.min(99,Math.round(t/total*100)));
   if(pct!==lastPct){lastPct=pct;if(onProg)onProg(pct);}
   requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
 });
 rec.stop();await doneP;
 const blob=new Blob(chunks,{type:'video/webm'});
 const url=URL.createObjectURL(blob);
 return{url:url,blob:blob,total:total};
}

handleAuthReturn();
nav();
